  sessionUsage: { inputTokens: 0, outputTokens: 0, cost: 0 }
};

function loadState() {
  try {
    const saved = localStorage.getItem('dd-office-v2');
    if (saved) { const s = JSON.parse(saved); state.projects = s.projects || []; }
    const settings = localStorage.getItem('dd-office-settings-v2');
    if (settings) state.settings = { ...state.settings, ...JSON.parse(settings) };
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem('dd-office-v2', JSON.stringify({ projects: state.projects }));
    localStorage.setItem('dd-office-settings-v2', JSON.stringify(state.settings));
  } catch (e) {}
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function getMaxTokens() {
  const model = state.settings.claudeModel || 'claude-sonnet-4-6';
  return model.includes('haiku') ? 8000 : 16000;
}

function calculateCost(usage) {
  const model = state.settings.claudeModel || 'claude-sonnet-4-6';
  const pricing = MODEL_PRICING[model] || MODEL_PRICING['claude-sonnet-4-6'];
  return ((usage.input_tokens || 0) * pricing.input + (usage.output_tokens || 0) * pricing.output) / 1_000_000;
}

function getProject() { return state.projects.find(p => p.id === state.currentProjectId); }

function getProgress(project) {
  const done = AGENTS.filter(a => project.conclusions?.[a.id]?.text).length;
  return Math.round((done / AGENTS.length) * 100);
}

function statusClass(status) {
  if (status === 'Активный') return 'status-active';
  if (status === 'Завершён') return 'status-done';
  if (status === 'Пауза') return 'status-paused';
  if (status === 'Отменён') return 'status-cancelled';
  return 'status-active';
}

// FILE EXTRACTION

async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt') {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.onerror = reject;
      r.readAsText(file, 'UTF-8');
    });
  }
  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js не загружен');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = `[PDF: ${file.name}, ${pdf.numPages} стр.]\n`;
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const ct = await pg.getTextContent();
      text += ct.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }
  if (ext === 'xlsx' || ext === 'xls') {
    if (typeof XLSX === 'undefined') throw new Error('SheetJS не загружен');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let text = `[Excel: ${file.name}]\n`;
    wb.SheetNames.forEach(sn => {
      text += `\n=== Лист: ${sn} ===\n`;
      text += XLSX.utils.sheet_to_csv(wb.Sheets[sn]);
    });
    return text;
  }
  if (ext === 'docx') {
    if (typeof mammoth === 'undefined') throw new Error('Mammoth не загружен');
    const buf = await file.arrayBuffer();
    const res = await mammoth.extractRawText({ arrayBuffer: buf });
    return `[Word: ${file.name}]\n` + res.value;
  }
  throw new Error(`Формат .${ext} не поддерживается`);
}

async function claudeFetch(key, body) {
  const direct = 'https://api.anthropic.com/v1/messages';
  const proxy  = 'https://corsproxy.io/?url=' + encodeURIComponent(direct);
  const headers = {
    'x-api-key': key,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true',
    'anthropic-beta': 'web-search-2025-03-05',
    'content-type': 'application/json'
  };
  // Try direct first, fall back to proxy
  try {
    const res = await fetch(direct, { method: 'POST', headers, body });
    if (res.status !== 0) return res; // got a real response (even error)
  } catch (_) {}
  return fetch(proxy, { method: 'POST', headers, body });
}

async function callClaude(systemPrompt, userContent) {
  const key = state.settings.claudeKey;
  if (!key) throw new Error('API ключ не настроен. Перейдите в ⚙️ Настройки.');
  const body = JSON.stringify({
    model: state.settings.claudeModel || 'claude-sonnet-4-6',
    max_tokens: getMaxTokens(),
    system: systemPrompt,
    messages: [{ role: 'user', content: userContent }],
    tools: [{ type: 'web_search_20250305', name: 'web_search' }]
  });
  const res = await claudeFetch(key, body);
  if (!res.ok) {
    let msg = 'Ошибка Claude API';
    try { const err = await res.json(); msg = err.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  if (data.usage) {
    state.sessionUsage.inputTokens += data.usage.input_tokens || 0;
    state.sessionUsage.outputTokens += data.usage.output_tokens || 0;
    state.sessionUsage.cost += calculateCost(data.usage);
  }
  const textBlocks = (data.content || []).filter(b => b.type === 'text');
  return textBlocks.map(b => b.text).join('\n');
}

async function callClaudeMessages(systemPrompt, messages) {
  const key = state.settings.claudeKey;
  if (!key) throw new Error('API ключ не настроен. Перейдите в ⚙️ Настройки.');
  const body = JSON.stringify({
    model: state.settings.claudeModel || 'claude-sonnet-4-6',
    max_tokens: 4000,
    system: systemPrompt,
    messages,
    tools: [{ type: 'web_search_20250305', name: 'web_search' }]
  });
  const res = await claudeFetch(key, body);
  if (!res.ok) {
    let msg = 'Ошибка Claude API';
    try { const err = await res.json(); msg = err.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  if (data.usage) {
    state.sessionUsage.inputTokens += data.usage.input_tokens || 0;
    state.sessionUsage.outputTokens += data.usage.output_tokens || 0;
    state.sessionUsage.cost += calculateCost(data.usage);
  }
  return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
}

function buildContext(project) {
  let ctx = `ПРОЕКТ: ${project.name}\n`;
  if (project.client) ctx += `КЛИЕНТ: ${project.client}\n`;
  if (project.dealType) ctx += `ТИП СДЕЛКИ: ${project.dealType}\n`;
  if (project.industry) ctx += `ОТРАСЛЬ: ${project.industry}\n`;
  if (project.depth) ctx += `ГЛУБИНА АНАЛИЗА: ${project.depth}\n`;
  if (project.sellerPrice) ctx += `ЦЕНА ПРОДАВЦА: $${project.sellerPrice} млн\n`;
  if (project.targetPrice) ctx += `ЦЕЛЕВАЯ ЦЕНА: $${project.targetPrice} млн\n`;
  if (project.isGroup && project.companies?.length) {
    ctx += `\n${'='.repeat(50)}\nСТРУКТУРА ГРУППЫ КОМПАНИЙ (${project.companies.length} юр. лиц):\n${'='.repeat(50)}\n`;
    project.companies.forEach((c, i) => {
      ctx += `${i + 1}. ${c.name} [${c.role}]${c.ownership ? ` — доля ${c.ownership}%` : ''}\n`;
    });
    if (project.ownershipDesc) ctx += `\nСхема владения / комментарий:\n${project.ownershipDesc}\n`;
  }
  ctx += `\nЗАДАЧА:\n${project.task || 'Провести полный DD анализ'}\n`;
  if (project.files?.length) {
    ctx += `\n${'='.repeat(50)}\nМАТЕРИАЛЫ ПРОЕКТА:\n${'='.repeat(50)}\n`;
    project.files.forEach(f => {
      ctx += `\n[Файл: ${f.name}]\n${(f.text || '').substring(0, 15000)}\n`;
    });
  }
  return ctx;
}

function buildContextWithConclusions(project, upToIndex) {
  let ctx = buildContext(project);
  const done = AGENTS.slice(0, upToIndex).filter(a => project.conclusions?.[a.id]?.text);
  if (done.length) {
    ctx += `\n${'='.repeat(50)}\nЗАКЛЮЧЕНИЯ КОМАНДЫ:\n${'='.repeat(50)}\n`;
    done.forEach(a => {
      ctx += `\n${a.icon} ${a.name.toUpperCase()}:\n${project.conclusions[a.id].text}\n`;
    });
  }
  return ctx;
}

async function runAgent(project, agentId) {
  const agentIndex = AGENTS.findIndex(a => a.id === agentId);
  const agent = AGENTS[agentIndex];
  const needsConclusions = agentId === 'risk' || agentId === 'ceo';
  const ctx = needsConclusions ? buildContextWithConclusions(project, agentIndex) : buildContext(project);
  // Save old conclusion to history before overwriting
  if (project.conclusions?.[agentId]?.text) {
    if (!project.conclusionHistory) project.conclusionHistory = {};
    if (!project.conclusionHistory[agentId]) project.conclusionHistory[agentId] = [];
    project.conclusionHistory[agentId].unshift({
      text: project.conclusions[agentId].text,
      timestamp: project.conclusions[agentId].timestamp || new Date().toISOString()
    });
    project.conclusionHistory[agentId] = project.conclusionHistory[agentId].slice(0, 5);
  }
  let systemPrompt = agent.systemPrompt;
  if (project.isGroup && project.companies?.length) {
    const groupList = project.companies.map(c => `${c.name} [${c.role}${c.ownership ? ', ' + c.ownership + '%' : ''}]`).join(', ');
    systemPrompt = `ОБЯЗАТЕЛЬНЫЕ ТРЕБОВАНИЯ — ГРУППА КОМПАНИЙ:
Объект DD — группа из ${project.companies.length} юридических лиц: ${groupList}.
В своём заключении ты ОБЯЗАН:
1. Анализировать каждое юридическое лицо отдельно (отдельные строки/таблицы), затем давать консолидированную картину
2. Выявлять и ЭЛИМИНИРОВАТЬ внутригрупповые операции: продажи товаров и услуг между компаниями группы, внутригрупповые займы и проценты по ним, роялти и управленческие платы, дивиденды внутри группы, остатки по расчётам между компаниями
3. Строить консолидированные показатели только после элиминирования — иначе будет двойной счёт
4. Отдельно анализировать холдинговую компанию: есть ли реальный substance, нет ли утечки стоимости через холдинг, какова реальная стоимость активов у активодержащих компаний
5. Указывать, в каком юридическом лице находится каждый существенный актив, обязательство или риск

${systemPrompt}`;
  }
  const text = await callClaude(systemPrompt, ctx);
  if (!project.conclusions) project.conclusions = {};
  project.conclusions[agentId] = { text, timestamp: new Date().toISOString() };
  saveState();
}

async function runAllAgents(projectId) {
  if (state.runningAgent) return;
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!state.settings.claudeKey) { showToast('Сначала добавьте Claude API ключ в Настройках', 'error'); navigate('settings'); return; }

  for (let i = 0; i < AGENTS.length; i++) {
    const agent = AGENTS[i];
    state.runningAgent = agent.id;
    render();
    try {
      await runAgent(project, agent.id);
      showToast(`${agent.icon} ${agent.name}: заключение получено`, 'success', 2000);
    } catch (e) {
      showToast(`${agent.icon} ${agent.name}: ошибка — ${e.message}`, 'error', 5000);
      state.runningAgent = null;
      render();
      return;
    }
  }
  state.runningAgent = null;
  project.status = 'Завершён';
  saveState();
  showToast('✅ DD анализ завершён! Вердикт CEO готов.', 'success', 6000);
  state.currentTab = 'report';
  render();
}

async function runSingleAgent(projectId, agentId) {
  if (state.runningAgent) return;
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!state.settings.claudeKey) { showToast('Сначала добавьте Claude API ключ в Настройках', 'error'); navigate('settings'); return; }
  const agent = AGENTS.find(a => a.id === agentId);
  state.runningAgent = agentId;
  render();
  try {
    await runAgent(project, agentId);
    showToast(`${agent.icon} ${agent.name}: заключение получено`, 'success');
  } catch (e) {
    showToast(`Ошибка: ${e.message}`, 'error', 5000);
  }
  state.runningAgent = null;
  render();
}

async function notionReq(endpoint, method, body) {
  const token = state.settings.notionToken;
  if (!token) throw new Error('Notion токен не настроен. Перейдите в Настройки.');
  const url = `https://api.notion.com/v1${endpoint}`;
  const proxy = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, {
    method,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Notion-Version': '2022-06-28'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    let msg = 'Ошибка Notion API';
    try { const e = await res.json(); msg = e.message || msg; } catch(err) {}
    throw new Error(msg);
  }
  return res.json();
}

function notionText(str) {
  if (!str) return [];
  const chunks = [];
  for (let i = 0; i < str.length; i += 2000) chunks.push({ type: 'text', text: { content: str.slice(i, i + 2000) } });
  return chunks;
}

async function saveToNotion(project) {
  const props = {
    'Проект': { title: [{ text: { content: project.name } }] },
    'Статус': { select: { name: project.status || 'Активный' } }
  };
  if (project.client) props['Клиент'] = { rich_text: notionText(project.client) };
  if (project.task) props['Задача'] = { rich_text: notionText(project.task.substring(0, 2000)) };
  if (project.dealType) props['Тип сделки'] = { select: { name: project.dealType } };
  if (project.industry) props['Отрасль'] = { select: { name: project.industry } };
  if (project.depth) props['Глубина анализа'] = { select: { name: project.depth } };
  if (project.sellerPrice) props['Цена продавца $млн'] = { number: parseFloat(project.sellerPrice) };
  if (project.targetPrice) props['Целевая цена $млн'] = { number: parseFloat(project.targetPrice) };
  props['Прогресс %'] = { number: getProgress(project) };
  props['Заключений агентов'] = { number: AGENTS.filter(a => project.conclusions?.[a.id]?.text).length };

  const projectPage = await notionReq('/pages', 'POST', {
    parent: { database_id: NOTION_PROJECTS_DB },
    properties: props
  });
  const notionId = projectPage.id;
  project.notionId = notionId;
  saveState();

  const completed = AGENTS.filter(a => project.conclusions?.[a.id]?.text);
  for (const agent of completed) {
    const text = project.conclusions[agent.id].text;
    const blocks = [];
    for (let i = 0; i < text.length; i += 2000) {
      blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: [{ type: 'text', text: { content: text.slice(i, i + 2000) } }] } });
    }
    await notionReq('/pages', 'POST', {
      parent: { database_id: NOTION_CONCLUSIONS_DB },
      properties: {
        'Заголовок': { title: [{ text: { content: `${project.name} — ${agent.name}` } }] },
        'Агент': { select: { name: agent.name } },
        'Проект': { relation: [{ id: notionId }] },
        'Статус': { select: { name: 'Получено' } }
      },
      children: blocks.slice(0, 100)
    });
  }
  return notionId;
}

  a.click(); URL.revokeObjectURL(url);
}

function generateBig4Html(project, singleAgentId) {
  const date = new Date().toLocaleDateString('ru-RU', {year:'numeric',month:'long',day:'numeric'});
  const agentLabel = singleAgentId ? ' · ' + (AGENTS.find(a => a.id === singleAgentId)?.name || '') : '';
  const printAgents = singleAgentId && singleAgentId !== 'ceo'
    ? AGENTS.filter(a => a.id === singleAgentId && project.conclusions?.[a.id]?.text)
    : singleAgentId === 'ceo'
      ? []
      : AGENTS.filter(a => a.id !== 'ceo' && project.conclusions?.[a.id]?.text);
  const hasCeo = !singleAgentId || singleAgentId === 'ceo';
  const ceoData = project.conclusions?.ceo;

  // ── Cover ──
  let h = `<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
  <title>DD — ${escHtml(project.name)}${agentLabel}</title>${big4Css()}</head><body>
  <div class="cover">
    <div class="c-top"><div class="c-brand">⚖️ DD Офис</div><div class="c-sub">Due Diligence · Профессиональный анализ</div></div>
    <div class="c-confid">КОНФИДЕНЦИАЛЬНО — ТОЛЬКО ДЛЯ АДРЕСАТА</div>
    <div class="c-body">
      <div class="c-label">Due Diligence${escHtml(agentLabel)}</div>
      <div class="c-title">${escHtml(project.name)}</div>
      ${project.client ? `<div class="c-client">${escHtml(project.client)}</div>` : ''}
      <div class="c-rule"></div>
      <div class="c-grid">
        <div class="c-cell"><div class="c-clabel">Тип сделки</div><div class="c-cval">${escHtml(project.dealType||'—')}</div></div>
        <div class="c-cell"><div class="c-clabel">Отрасль</div><div class="c-cval">${escHtml(project.industry||'—')}</div></div>
        <div class="c-cell"><div class="c-clabel">Глубина анализа</div><div class="c-cval">${escHtml(project.depth||'—')}</div></div>
        <div class="c-cell"><div class="c-clabel">Дата отчёта</div><div class="c-cval">${date}</div></div>
        ${project.sellerPrice ? `<div class="c-cell"><div class="c-clabel">Цена продавца</div><div class="c-cval">$${escHtml(project.sellerPrice)} млн</div></div>` : ''}
        ${project.targetPrice ? `<div class="c-cell"><div class="c-clabel">Целевая цена</div><div class="c-cval">$${escHtml(project.targetPrice)} млн</div></div>` : ''}
        ${project.isGroup && project.companies?.length ? `<div class="c-cell" style="grid-column:1/-1"><div class="c-clabel">Структура</div><div class="c-cval">Группа ${project.companies.length} юр. лиц: ${project.companies.map(c=>escHtml(c.name)).join(', ')}</div></div>` : ''}
      </div>
    </div>
    <div class="c-foot">Настоящий отчёт подготовлен DD Офисом на основе предоставленных материалов и является конфиденциальным. Несанкционированное распространение или использование запрещено. DD Офис не несёт ответственности за решения, принятые на основании данного отчёта без дополнительной независимой проверки.</div>
  </div>`;

  // ── TOC (только для полного отчёта) ──
  if (!singleAgentId) {
    h += `<div class="toc"><div class="toc-h">Содержание</div>
    ${printAgents.map(a => `<div class="toc-row"><span class="toc-ico">${a.icon}</span><span class="toc-nm">${a.name} — ${a.short}</span></div>`).join('')}
    ${hasCeo && ceoData?.text ? `<div class="toc-row"><span class="toc-ico">👔</span><span class="toc-nm"><strong>CEO — Итоговый вердикт</strong></span></div>` : ''}
    </div>`;
  }

  // ── Agent sections ──
  printAgents.forEach(agent => {
    const c = project.conclusions[agent.id];
    const ts = c.timestamp ? new Date(c.timestamp).toLocaleString('ru-RU') : date;
    h += `<div class="ag-sec">
      <div class="ag-hd"><div class="ag-ico">${agent.icon}</div><div><div class="ag-name">${agent.name}</div><div class="ag-role">${agent.short}</div><div class="ag-ts">Заключение: ${ts}</div></div></div>
      <div class="ag-body">${renderMarkdown(c.text)}</div>
    </div>`;
  });

  // ── CEO ──
  if (hasCeo && ceoData?.text) {
    const ts = ceoData.timestamp ? new Date(ceoData.timestamp).toLocaleString('ru-RU') : date;
    h += `<div class="ceo-sec">
      <div class="ceo-hd"><div class="ceo-ey">Итоговое заключение</div><div class="ceo-ti">👔 Вердикт CEO</div></div>
      <div class="ceo-body">${renderMarkdown(ceoData.text)}</div>

  }

  h += `</body></html>`;
  return h;
}

function printBig4Report(project, agentId) {
  const html = generateBig4Html(project, agentId || null);
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 800);
}

function exportWordDoc(project, agentId) {
  const inner = generateBig4Html(project, agentId || null);
  const wordHtml = inner
    .replace('<!DOCTYPE html>', '')
    .replace('<html lang="ru">', '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">');
  const blob = new Blob(['﻿' + wordHtml], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const suffix = agentId ? '_' + (AGENTS.find(x => x.id === agentId)?.name || agentId) : '';
  a.href = url;
  a.download = `DD_${project.name}${suffix}_${new Date().toISOString().slice(0,10)}.doc`;
  a.click();
  URL.revokeObjectURL(url);
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^• (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`);
  html = html.replace(/\|(.+)\|/g, (m, inner) => {
    const cells = inner.split('|').map(c => c.trim());
    return '<tr>' + cells.map(c => {
      if (c.match(/^[-:]+$/)) return '';
      return `<td>${c}</td>`;
    }).filter(Boolean).join('') + '</tr>';
  });
  html = html.replace(/(<tr>.*<\/tr>\n?)+/g, s => `<table>${s}</table>`);
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function testClaudeKey() {
  const key = document.getElementById('s-claude-key').value.trim();
  if (!key) { showToast('Введите ключ', 'error'); return; }
  showToast('Проверяю ключ...', 'info', 4000);
  try {
    const body = JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 10, messages: [{ role: 'user', content: 'Hi' }] });
    const res = await claudeFetch(key, body);
    if (res.ok) showToast('✅ Claude API ключ работает!', 'success');
    else {
      let msg = 'Неверный ключ';
      try { const e = await res.json(); msg = e.error?.message || msg; } catch(_) {}
      showToast('❌ ' + msg, 'error', 7000);
    }
  } catch (e) {
    showToast('❌ Ошибка сети: ' + (e?.message || String(e)), 'error', 7000);
  }
}

async function testNotionToken() {
  const token = document.getElementById('s-notion-token').value.trim();
  if (!token) { showToast('Введите токен', 'error'); return; }
  showToast('Проверяю токен...', 'info', 3000);
  try {
    const url = 'https://api.notion.com/v1/users/me';
    const proxy = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, { headers: { 'Authorization': `Bearer ${token}`, 'Notion-Version': '2022-06-28' } });
    if (res.ok) showToast('✅ Notion токен работает!', 'success');
    else showToast('❌ Неверный Notion токен', 'error', 5000);
  } catch (e) { showToast('❌ Ошибка подключения', 'error', 5000); }
}

function saveSettings() {
  state.settings.claudeKey = (document.getElementById('s-claude-key')?.value||'').trim();
  state.settings.notionToken = (document.getElementById('s-notion-token')?.value||'').trim();
  state.settings.claudeModel = document.getElementById('s-model')?.value || 'claude-sonnet-4-6';
  saveState();
  showToast('✅ Настройки сохранены', 'success');
  render();
}

// ── NEW PROJECT ──

function renderNewProject() {
  const { step, data, files } = state.newProject;
  return `<div class="p-6 max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-6">
      <button onclick="navigate('dashboard')" class="btn-ghost">← Назад</button>
      <h1 class="text-xl font-bold text-white">Новый проект DD</h1>
    </div>
    <div class="flex gap-2 mb-6">
      ${[1,2,3].map(s => `<div class="flex-1 h-1.5 rounded-full ${s<=step?'bg-blue-500':'bg-slate-700'}"></div>`).join('')}
    </div>
    <div class="card p-6">
      ${step===1 ? renderStep1(data) : step===2 ? renderStep2(files) : renderStep3(data)}
    </div>
  </div>`;
}

    <div>

        <label class="text-sm text-slate-400 block mb-1">Отрасль</label>

      <div>

          ${DEPTHS.map(d=>`<option value="${d}" ${data.depth===d?'selected':''}>${d}</option>`).join('')}

        <span class="text-xs text-slate-400">— агенты выполнят элиминирование и консолидацию</span>
      </div>
      <div class="space-y-2">
        ${(data.companies||[]).map((c,i)=>`<div class="gc-row grid gap-2 items-center" style="grid-template-columns:1fr 180px 80px 32px">
          <input type="text" class="input gc-name text-sm" value="${escHtml(c.name)}" placeholder="Название юр. лица">
          <select class="input gc-role text-sm">
            ${COMPANY_ROLES.map(r=>`<option ${c.role===r?'selected':''}>${r}</option>`).join('')}

  <div class="drop-zone mb-4" id="drop-zone" onclick="document.getElementById('file-input').click()">

      <div class="font-medium text-slate-300">Перетащите файлы или нажмите для выбора</div>

  </div>

  ${files.map((f,i) => `<div class="flex items-center gap-3 p-3 bg-navy-800 rounded-lg mb-2">

    <div class="flex gap-3">

// ── PROJECT ──

function renderProject() {
  const project = getProject();
  if (!project) { navigate('dashboard'); return ''; }
  const tabs = [
    { id: 'overview', label: '📋 Обзор' },
    { id: 'agents', label: '🤖 Агенты' },
    { id: 'report', label: '📄 Отчёт' },
    { id: 'checklist', label: '✅ Задачи' },
    { id: 'finmodel', label: '📊 Финмодель' },
    { id: 'risks', label: '🎯 Риски' }
  ];
  return `<div class="max-w-5xl mx-auto">
    <div class="px-6 pt-5 pb-0">
      <div class="flex items-start justify-between mb-4">
        <div>
          <button onclick="navigate('dashboard')" class="text-slate-400 text-sm hover:text-white mb-1 block no-print">← Все проекты</button>
          <h1 class="text-xl font-bold text-white">${escHtml(project.name)}</h1>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-xs px-2 py-0.5 rounded-full ${statusClass(project.status)}">${project.status||'Активный'}</span>
            ${project.industry?`<span class="text-xs text-slate-400">${escHtml(project.industry)}</span>`:''}
            ${project.depth?`<span class="text-xs text-slate-400">· ${escHtml(project.depth)}</span>`:''}
          </div>
        </div>
        <div class="flex items-center gap-2 no-print">
          <select onchange="changeProjectStatus(event)" class="input text-sm w-36">
            ${['Активный','Завершён','Пауза','Отменён'].map(s=>`<option value="${s}" ${project.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <button onclick="deleteProject('${project.id}')" class="btn-ghost text-red-400 text-sm">🗑</button>
        </div>
      </div>
      <div class="flex border-b border-slate-700 no-print">
        ${tabs.map(t=>`<button onclick="switchTab('${t.id}')" class="px-4 py-2.5 text-sm font-medium transition-colors ${state.currentTab===t.id?'tab-active':'tab-inactive'}">${t.label}</button>`).join('')}
      </div>
    </div>
    <div class="p-6">
      ${state.currentTab==='overview' ? renderOverviewTab(project) : state.currentTab==='agents' ? renderAgentsTab(project) : state.currentTab==='checklist' ? renderChecklistTab(project) : state.currentTab==='finmodel' ? renderFinModelTab(project) : state.currentTab==='risks' ? renderRiskMatrixTab(project) : renderReportTab(project)}
    </div>
  </div>`;
}

function renderOverviewTab(project) {
  const done = AGENTS.filter(a => project.conclusions?.[a.id]?.text).length;
  return `<div class="grid grid-cols-2 gap-4 mb-5">
    <div class="card p-4">
      <div class="text-xs text-slate-400 mb-2">Параметры сделки</div>
      ${project.client?`<div class="text-sm"><span class="text-slate-400">Клиент:</span> <span class="text-white">${escHtml(project.client)}</span></div>`:''}
      ${project.dealType?`<div class="text-sm mt-1"><span class="text-slate-400">Тип:</span> <span class="text-white">${escHtml(project.dealType)}</span></div>`:''}
      ${project.sellerPrice?`<div class="text-sm mt-1"><span class="text-slate-400">Цена продавца:</span> <span class="text-white">$${project.sellerPrice} млн</span></div>`:''}
      ${project.targetPrice?`<div class="text-sm mt-1"><span class="text-slate-400">Целевая:</span> <span class="text-white">$${project.targetPrice} млн</span></div>`:''}
      ${project.isGroup && project.companies?.length ? `<div class="mt-2 pt-2 border-t border-slate-700">
        <div class="text-xs text-blue-400 mb-1">🏗 Группа (${project.companies.length} юр. лиц)</div>
        ${project.companies.map(c=>`<div class="text-xs text-slate-300 mt-0.5">• ${escHtml(c.name)} <span class="text-slate-500">[${escHtml(c.role)}${c.ownership?', '+escHtml(c.ownership)+'%':''}]</span></div>`).join('')}
      </div>` : ''}
    </div>
    <div class="card p-4">
      <div class="text-xs text-slate-400 mb-2">Прогресс анализа</div>
      <div class="text-2xl font-bold text-white mb-1">${done}/8</div>
      <div class="text-xs text-slate-400 mb-2">агентов завершили</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${getProgress(project)}%"></div></div>
      <div class="mt-3 pt-3 border-t border-slate-700">
        <div class="text-xs text-slate-400 mb-1">Дедлайн DD</div>
        <input type="date" class="input text-sm" value="${escHtml(project.deadline||'')}" onchange="setProjectDeadline('${project.id}', this.value)" style="padding:6px 10px">
        ${project.deadline ? `<div class="text-xs mt-1 ${new Date(project.deadline) < new Date() ? 'text-red-400' : 'text-green-400'}">${new Date(project.deadline) < new Date() ? '⚠️ Просрочен' : '✅ ' + Math.ceil((new Date(project.deadline)-new Date())/(1000*60*60*24)) + ' дн. осталось'}</div>` : ''}
      </div>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <div class="flex items-center justify-between mb-2">
      <div class="text-xs text-slate-400">Задача</div>
      ${!state.editingTask ? `<button onclick="startEditTask()" class="btn-ghost text-xs px-2 py-1">✏️ Редактировать</button>` : ''}
    </div>
    ${state.editingTask ? `
      <textarea id="edit-task-input" class="input text-sm" rows="7" style="resize:vertical">${escHtml(project.task||'')}</textarea>
      <div class="flex gap-2 mt-3">
        <button onclick="saveTaskEdit()" class="btn-primary text-sm">💾 Сохранить</button>
        <button onclick="cancelTaskEdit()" class="btn-secondary text-sm">Отмена</button>
      </div>
    ` : `<div class="text-sm text-slate-300 whitespace-pre-wrap">${project.task ? escHtml(project.task) : '<span class="text-slate-500">Задача не указана</span>'}</div>`}
  </div>

  <div class="card p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="text-xs text-slate-400">Файлы (${project.files?.length || 0})</div>
      <label class="btn-ghost text-xs px-2 py-1 cursor-pointer">
        📎 Добавить файлы
        <input type="file" multiple accept=".pdf,.xlsx,.xls,.docx,.txt" style="display:none" onchange="addProjectFiles('${project.id}', this.files)">
      </label>
    </div>
    ${project.files?.length ? `<div class="space-y-1.5">
      ${project.files.map((f,i)=>`<div class="flex items-center gap-2 text-sm text-slate-300">
        <span class="text-base">${f.name.endsWith('.pdf')?'📄':f.name.match(/\.xlsx?$/)?'📊':f.name.endsWith('.docx')?'📝':'📋'}</span>
        <span class="flex-1 truncate">${escHtml(f.name)}</span>
        <span class="text-xs text-slate-500 flex-shrink-0">${((f.text||'').length/1000).toFixed(0)}к</span>
        <button onclick="removeProjectFile('${project.id}',${i})" class="text-slate-600 hover:text-red-400 text-lg leading-none flex-shrink-0" title="Удалить файл">×</button>
      </div>`).join('')}
    </div>` : `<div class="text-xs text-slate-500">Нет загруженных файлов — добавьте материалы клиента</div>`}
  </div>

  ${renderGanttSection(project)}`;
}

function renderAgentsTab(project) {
  const isRunning = !!state.runningAgent;
  const allDone = AGENTS.every(a => project.conclusions?.[a.id]?.text);
  const chatPanel = state.chatAgentId ? renderAgentChatPanel(project, state.chatAgentId) : '';
  const searchPanel = state.searchAgentId ? renderAgentSearchPanel(project, state.searchAgentId) : '';
  return `<div class="mb-4 flex gap-3 items-center flex-wrap">
    <button onclick="runAllAgents('${project.id}')" class="btn-primary" ${isRunning?'disabled':''}>
      ${isRunning ? `<span class="spinner mr-2"></span>Анализирует...` : '🚀 Запустить всех агентов'}
    </button>
    ${allDone ? `<button onclick="switchTab('report')" class="btn-secondary">📄 Смотреть отчёт</button>` : ''}
    ${isRunning ? `<span class="text-sm text-slate-400">Работает: ${AGENTS.find(a=>a.id===state.runningAgent)?.name||state.runningAgent}</span>` : ''}
  </div>
  <div class="grid grid-cols-2 gap-3 mb-4">
    ${AGENTS.map(agent => {
      const conclusion = project.conclusions?.[agent.id];
      const running = state.runningAgent === agent.id;
      const done = !!conclusion?.text;
      const isCeo = agent.id === 'ceo';
      const isRisk = agent.id === 'risk';
      const needsOthers = (isCeo || isRisk) && !allDone;
      const chatActive = state.chatAgentId === agent.id;
      const searchActive = state.searchAgentId === agent.id;
      return `<div class="card p-4 agent-card border ${done?'border-green-800/50':running?'border-blue-500':'border-slate-700'}">
        <div class="flex items-start justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-xl">${agent.icon}</span>
            <div>
              <div class="font-medium text-white text-sm">${agent.name}</div>
              <div class="text-xs text-slate-400">${agent.short}</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            ${done ? `<span class="text-green-400 text-lg">✓</span>` : running ? `<span class="spinner"></span>` : ''}
            <button onclick="runSingleAgent('${project.id}','${agent.id}')" class="btn-ghost text-xs px-2 py-1" ${isRunning?'disabled':''} title="Запустить отдельно">▶</button>
          </div>
        </div>
        ${running ? `<div class="text-xs text-blue-400 animate-pulse">Анализирует...</div>` :
          done ? `<div class="text-xs text-slate-300 line-clamp-2">${escHtml((conclusion.text||'').substring(0,120))}...</div>` :
          needsOthers ? `<div class="text-xs text-slate-500">Ожидает остальных агентов</div>` :
          `<div class="text-xs text-slate-500">Ожидает запуска</div>`}
        ${done ? `<div class="flex gap-1 mt-2 pt-2 border-t border-slate-700/50">
          <button onclick="state.chatAgentId='${agent.id}';state.searchAgentId=null;render()" class="btn-ghost text-xs px-2 py-0.5 ${chatActive?'text-blue-400':''}" title="Чат с агентом">💬 Чат</button>
          <button onclick="state.searchAgentId='${agent.id}';state.chatAgentId=null;render()" class="btn-ghost text-xs px-2 py-0.5 ${searchActive?'text-yellow-400':''}" title="Веб-поиск через агента">🔍 Поиск</button>
        </div>` : ''}
      </div>`;
    }).join('')}
  </div>
  ${chatPanel}
  ${searchPanel}`;
}

function renderAgentChatPanel(project, agentId) {
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return '';
  const messages = project.agentChats?.[agentId] || [];
  const running = state.chatRunning;
  return `<div class="card p-4 border border-blue-800/50">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="text-lg">${agent.icon}</span>
        <span class="font-semibold text-white text-sm">Чат с агентом: ${agent.name}</span>
      </div>
      <div class="flex gap-2">
        ${messages.length ? `<button onclick="clearAgentChat('${project.id}','${agentId}')" class="btn-ghost text-xs px-2 py-1 text-slate-500">🗑 Очистить</button>` : ''}
        <button onclick="state.chatAgentId=null;render()" class="btn-ghost text-xs px-2 py-1">✕ Закрыть</button>
      </div>
    </div>
    ${messages.length === 0 ? `<div class="text-xs text-slate-500 text-center py-4">Задай вопрос агенту — он ответит на основе своего заключения и материалов проекта</div>` : ''}
    <div id="chat-messages" class="space-y-3 mb-3 max-h-80 overflow-y-auto">
      ${messages.map(m => `<div class="flex gap-2 ${m.role==='user'?'justify-end':''}">
        ${m.role==='assistant' ? `<span class="flex-shrink-0 mt-0.5">${agent.icon}</span>` : ''}
        <div class="rounded-lg px-3 py-2 text-sm max-w-[85%] ${m.role==='user' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-100'}">${m.role==='assistant' ? renderMarkdown(m.content) : escHtml(m.content)}</div>
      </div>`).join('')}
      ${running ? `<div class="flex gap-2"><span class="text-lg">${agent.icon}</span><div class="bg-slate-700 rounded-lg px-3 py-2 text-sm text-slate-400"><span class="spinner mr-1"></span>Думает...</div></div>` : ''}
    </div>
    <div class="flex gap-2">
      <input id="chat-input" type="text" class="input text-sm flex-1" placeholder="Задай вопрос агенту..." ${running?'disabled':''} onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAgentChatMessage('${project.id}','${agentId}')}" value="${escHtml(state.chatInput)}">
      <button onclick="sendAgentChatMessage('${project.id}','${agentId}')" class="btn-primary text-sm px-4" ${running?'disabled':''}>
        ${running ? '<span class="spinner"></span>' : 'Отправить'}
      </button>
    </div>
  </div>`;
}

function renderAgentSearchPanel(project, agentId) {
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return '';
  const results = project.searchResults?.[agentId] || [];
  const running = state.chatRunning;
  return `<div class="card p-4 border border-yellow-800/50">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="text-lg">🔍</span>
        <span class="font-semibold text-white text-sm">Веб-поиск через ${agent.name}</span>
        <span class="text-xs text-slate-500">Агент ищет в интернете и делает выводы по проекту</span>
      </div>

function renderFinModelTab(project) {
  const models = project.finModels || [];
  const latest = models[0];
  const running = state.finModelRunning;
  const hasConclusions = project.conclusions?.financier?.text || project.conclusions?.risk?.text;

  const yearBtns = [3, 5, 7].map(y =>
    `<button onclick="state.finModelYears=${y};render()" class="btn-${state.finModelYears===y?'primary':'secondary'} text-xs px-3 py-1.5">${y} лет</button>`
  ).join('');

  let preview = '';
  if (latest) {
    const d = latest.data;
    const sc = d.scenarios || {};
    const keys = ['pessimistic','base','optimistic'];
    const scNames = { pessimistic:'🔴 Пессимист', base:'🟡 Реалист', optimistic:'🟢 Оптимист' };
    const cols = keys.filter(k => sc[k]);

    const metricRow = (label, fn) =>
      `<tr class="border-b border-slate-700"><td class="py-2 pr-4 text-xs text-slate-400 w-48">${label}</td>${cols.map(k => `<td class="py-2 px-3 text-xs text-right text-white">${fn(sc[k], d)}</td>`).join('')}</tr>`;

    const avgRevGrowth = (s) => {
      const g = s.revenueGrowth || [];
      return g.length ? (g.reduce((a,b)=>a+b,0)/g.length).toFixed(1)+'%' : '—';
    };
    const avgMargin = (arr) => {
      if (!arr?.length) return '—';
      return (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1)+'%';
    };
    const equityVal = (s, d) => {
      const H = (d.historicalYears||[]).length;
      const F = (d.forecastYears||[]).length;
      return _fmComputeEquityValue(d, s.id || Object.keys(d.scenarios).find(k => d.scenarios[k]===s));
    };

    // Compute equity values for weighted average
    const evVals = {};
    cols.forEach(k => { evVals[k] = _fmComputeEquityValue(d, k); });
    const weightedEV = cols.reduce((sum, k) => sum + evVals[k] * (sc[k].probability||0)/100, 0);
    const sellerPrice = parseFloat(project.sellerPrice) || 0;
    const discount = sellerPrice ? ((weightedEV - sellerPrice) / sellerPrice * 100).toFixed(1) : null;

    preview = `
    <div class="card overflow-hidden mb-4">
      <div class="px-4 py-3 border-b border-slate-700 flex items-center justify-between">
        <div class="text-sm font-semibold text-white">Финмодель · ${escHtml(d.company||project.name)} · ${d.forecastYears?.length||0} лет</div>
        <div class="text-xs text-slate-500">${new Date(latest.createdAt).toLocaleString('ru-RU')}</div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr class="border-b border-slate-600">
            <th class="py-2 pr-4 text-left text-xs text-slate-400 w-48">Показатель</th>
            ${cols.map(k => `<th class="py-2 px-3 text-right text-xs ${k==='base'?'text-yellow-300':k==='optimistic'?'text-green-400':'text-red-400'}">${scNames[k]}<br><span class="text-slate-500 font-normal">P=${sc[k].probability}%</span></th>`).join('')}
          </tr></thead>
          <tbody>
            ${metricRow('CAGR выручки', (s) => avgRevGrowth(s))}
            ${metricRow('WACC', (s) => (s.wacc||'—')+'%')}
            ${metricRow('Терм. рост', (s) => (s.terminalGrowth||'—')+'%')}
            ${metricRow('EBITDA margin (ср.)', (s) => avgMargin(s.ebitdaMargin))}
            ${metricRow('Equity Value, '+escHtml(d.currencyUnit||'млн'), (s,dd) => {
              const k = Object.keys(dd.scenarios).find(x => dd.scenarios[x]===s);
              return Math.round(evVals[k]).toLocaleString('ru-RU');
            })}
          </tbody>
        </table>
      </div>
      <div class="px-4 py-3 bg-slate-800/50 border-t border-slate-700">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div>
            <div class="text-xs text-slate-400 mb-0.5">Взвешенная Equity Value</div>
            <div class="text-xl font-bold text-white">${Math.round(weightedEV).toLocaleString('ru-RU')} ${escHtml(d.currencyUnit||'млн')} ${escHtml(d.currency||'')}</div>
            ${sellerPrice ? `<div class="text-xs mt-0.5 ${parseFloat(discount)>=0?'text-green-400':'text-red-400'}">${parseFloat(discount)>=0?'▲ Выше':'▼ Ниже'} цены продавца на ${Math.abs(parseFloat(discount))}% · продавец: ${sellerPrice} ${escHtml(d.currencyUnit||'млн')}</div>` : ''}
          </div>
          <div class="flex gap-2 flex-wrap">
            <button onclick="exportFinModelXlsx('${project.id}', 0)" class="btn-primary text-sm">📥 Скачать Excel (.xlsx)</button>
            <button onclick="generateFinModel('${project.id}')" class="btn-secondary text-sm" ${running?'disabled':''}>🔄 Пересчитать</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <div class="text-xs font-semibold text-slate-400 mb-3">Допущения по сценариям</div>
      ${cols.map(k => {
        const s = sc[k]; const a = s.assumptions || {};
        return `<div class="mb-3 last:mb-0">
          <div class="text-xs font-medium ${k==='base'?'text-yellow-300':k==='optimistic'?'text-green-400':'text-red-400'} mb-1">${scNames[k]} (${s.probability}%)</div>
          ${a.revenue?`<div class="text-xs text-slate-300 mb-0.5">📈 <span class="text-slate-500">Выручка:</span> ${escHtml(a.revenue)}</div>`:''}
          ${a.margin?`<div class="text-xs text-slate-300 mb-0.5">💰 <span class="text-slate-500">Маржа:</span> ${escHtml(a.margin)}</div>`:''}
          ${a.wacc?`<div class="text-xs text-slate-300 mb-0.5">📉 <span class="text-slate-500">WACC:</span> ${escHtml(a.wacc)}</div>`:''}
          ${a.probability?`<div class="text-xs text-slate-400 italic">${escHtml(a.probability)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  return `<div>
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-base font-semibold text-white">📊 Финансовая модель</h2>
        <div class="text-xs text-slate-400 mt-0.5">3 сценария с DCF-оценкой · Excel с формулами</div>
      </div>
      ${models.length > 0 ? `<div class="text-xs text-slate-500">${models.length} версий</div>` : ''}
    </div>

    ${!hasConclusions ? `<div class="card p-6 text-center text-slate-500 mb-4">
      <div class="text-3xl mb-2">🤖</div>
      <div class="text-sm">Для построения финмодели нужны заключения агентов</div>
      <div class="text-xs mt-1">Минимум — финансист и рисковик</div>
      <button onclick="switchTab('agents')" class="btn-primary mt-3 text-sm">Перейти к агентам</button>
    </div>` : ''}

    ${hasConclusions && !latest ? `<div class="card p-6 text-center mb-4">
      <div class="text-3xl mb-2">📊</div>
      <div class="text-sm text-white mb-1">Финмодель ещё не построена</div>
      <div class="text-xs text-slate-400 mb-4">Claude проанализирует заключения финансиста и рисковика и построит трёхсценарную модель с DCF</div>
    </div>` : ''}

    ${hasConclusions ? `<div class="card p-4 mb-4 flex items-center gap-4 flex-wrap">
      <div>
        <div class="text-xs text-slate-400 mb-1">Горизонт прогноза</div>
        <div class="flex gap-1.5">${yearBtns}</div>
      </div>
      <button onclick="generateFinModel('${project.id}')" class="btn-primary ml-auto" ${running?'disabled':''}>
        ${running ? `<span class="spinner mr-2"></span>Строю модель...` : latest ? '🔄 Перестроить модель' : '🚀 Построить финмодель'}
      </button>
    </div>` : ''}

    ${preview}
  </div>`;
}

async function generateFinModel(projectId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || state.finModelRunning) return;
  if (!state.settings.claudeKey) { showToast('Нет API ключа', 'error'); return; }

  const financierText = project.conclusions?.financier?.text || '';
  const riskText = project.conclusions?.risk?.text || '';
  const ceoText = project.conclusions?.ceo?.text || '';
  const auditorText = project.conclusions?.auditor?.text || '';

  if (!financierText && !riskText) {
    showToast('Нужны заключения финансиста и/или рисковика', 'error'); return;
  }

  state.finModelRunning = true;
  render();

  try {
    const F = state.finModelYears || 5;
    const curYear = new Date().getFullYear();
    const foreYears = Array.from({length: F}, (_, i) => curYear + i);

    const sysPrompt = `Ты — финансовый моделлер уровня инвестиционного банка (McKinsey/Goldman Sachs).
На основе заключений DD-анализа построй трёхсценарную финансовую модель.

КРИТИЧНО: Верни ТОЛЬКО валидный JSON без какого-либо текста до или после. Без markdown, без \`\`\`json, только объект {}.

Все числа — в единицах "${project.industry ? 'отрасли' : 'компании'}" (миллионы местной валюты если не указано иное).

// ══════════════════════════════════════════════════════════════
// FINANCIAL MODEL — EXCEL EXPORT
// ══════════════════════════════════════════════════════════════

function _fmC(colIdx) { // 0=A, 1=B, ...
  if (colIdx < 26) return String.fromCharCode(65 + colIdx);
  return String.fromCharCode(65 + Math.floor(colIdx/26) - 1) + String.fromCharCode(65 + colIdx%26);
}
function _fmRef(row, col) { return `${_fmC(col)}${row}`; }
function _fmR(n, dec) { return Math.round(n * Math.pow(10, dec||1)) / Math.pow(10, dec||1); }

function _fmCell(ws, row, col, val, isFormula) {
  const ref = _fmRef(row, col);
  if (isFormula) { ws[ref] = { t: 'n', f: String(val) }; }
  else if (typeof val === 'number') { ws[ref] = { t: 'n', v: val }; }
  else if (val !== null && val !== undefined && val !== '') { ws[ref] = { t: 's', v: String(val) }; }
}

function _fmComputeEquityValue(d, sk) {
  const sc = d.scenarios?.[sk];
  if (!sc) return 0;
  const H = (d.historicalYears||[]).length;
  const F = (d.forecastYears||[]).length;
  const wacc = (sc.wacc || 12) / 100;
  const tg = (sc.terminalGrowth || 2.5) / 100;

  // Compute forecast revenue
  const histRev = d.historical?.revenue || [];
  const foreRevs = [];
  let prevR = histRev[histRev.length-1] || 1000;
  for (let i = 0; i < F; i++) {
    prevR = prevR * (1 + (sc.revenueGrowth?.[i] || 5) / 100);
    foreRevs.push(prevR);
  }
  // Compute FCF for each forecast year
  const foreNI = foreRevs.map((r, i) => {
    const ebitda = r * (sc.ebitdaMargin?.[i] || 15) / 100;
    const da = sc.daAbsolute?.[i] || (d.historical?.da?.[H-1] || 40) * Math.pow(1.05, i+1);
    const interest = sc.interestSchedule?.[i] || 20;
    const taxRate = (sc.taxRate || d.historical?.taxRate || 20) / 100;
    const ebt = ebitda - da - interest;
    const tax = Math.max(0, ebt) * taxRate;
    return ebt - tax;
  });
  const foreDA = foreRevs.map((_, i) => sc.daAbsolute?.[i] || (d.historical?.da?.[H-1]||40)*Math.pow(1.05,i+1));
  const foreCapex = foreRevs.map((r, i) => r * (sc.capexPct?.[i] || 7) / 100);
  const foreWC = foreRevs.map((r, i) => r * (sc.wcChangePct?.[i] || 1) / 100);
  const foreFCF = foreNI.map((ni, i) => ni + foreDA[i] - foreCapex[i] - foreWC[i]);

  const pvFCFs = foreFCF.map((fcf, i) => fcf / Math.pow(1 + wacc, i + 1));
  const sumPV = pvFCFs.reduce((a, b) => a + b, 0);
  const termFCF = foreFCF[foreFCF.length-1] * (1 + tg);
  const tv = wacc > tg ? termFCF / (wacc - tg) : 0;
  const pvTV = tv / Math.pow(1 + wacc, F);
  const ev = sumPV + pvTV;
  return ev - (d.historical?.debt || 0) + (d.historical?.cash || 0);
}

function _fmBuildScenarioSheet(d, sk) {
  const sc = d.scenarios?.[sk];
  if (!sc) return null;
  const H = (d.historicalYears||[]).length;
  const F = (d.forecastYears||[]).length;
  const histYears = d.historicalYears || [];
  const foreYears = d.forecastYears || [];

  const LC = 0; // label column index
  const firstH = 1; // first historical column (B)
  const firstF = 1 + H; // first forecast column
  const lastF = firstF + F - 1;

  const ws = {};
  const S = (r, c, v) => _fmCell(ws, r, c, v, false);
  const F_ = (r, c, f) => _fmCell(ws, r, c, f, true);
  const R = (r, c) => _fmRef(r, c);

  // ── HEADER ──
  S(1, LC, `${d.company || 'Компания'} — Финансовая модель`);
  S(2, LC, `Сценарий: ${sc.name} · вероятность ${sc.probability}% · WACC=${sc.wacc}% · g=${sc.terminalGrowth}% · ${F} лет прогноза`);
  S(3, LC, '');

  // ── ROW 4: column headers ──
  S(4, LC, 'Показатель, ' + (d.currencyUnit||'млн') + ' ' + (d.currency||'USD'));
  histYears.forEach((y, i) => S(4, firstH+i, `${y} (факт)`));
  foreYears.forEach((y, i) => S(4, firstF+i, `${y} (прогноз)`));

  // ── ROWS 5-12: ASSUMPTION INPUTS (editable) ──
  S(5, LC, '── ВХОДНЫЕ ПАРАМЕТРЫ (синие ячейки — меняй, P&L пересчитается) ──');

  S(6, LC, 'Рост выручки, %');
  const histRev = d.historical?.revenue || [];
  histYears.forEach((y, i) => {
    if (i===0) { S(6, firstH, '—'); return; }
    const prev = histRev[i-1]||1; const cur = histRev[i]||prev;
    S(6, firstH+i, _fmR((cur/prev-1)*100));
  });
  foreYears.forEach((y, i) => S(6, firstF+i, sc.revenueGrowth?.[i] ?? 5));

  S(7, LC, 'Gross Margin, %');
  (d.historical?.grossMargin||[]).forEach((m, i) => S(7, firstH+i, m));
  (sc.grossMargin||[]).forEach((m, i) => S(7, firstF+i, m));

  S(8, LC, 'EBITDA Margin, %');
  (d.historical?.ebitdaMargin||[]).forEach((m, i) => S(8, firstH+i, m));
  (sc.ebitdaMargin||[]).forEach((m, i) => S(8, firstF+i, m));

  S(9, LC, 'CAPEX / Выручка, %');
  const histCapex = d.historical?.capex||[];
  histYears.forEach((y, i) => S(9, firstH+i, histRev[i] ? _fmR((histCapex[i]||0)/histRev[i]*100) : 7));
  (sc.capexPct||[]).forEach((p, i) => S(9, firstF+i, p));

  S(10, LC, 'ΔОборотный капитал / Выручка, %');
  const histWC = d.historical?.wcChange||[];
  histYears.forEach((y, i) => S(10, firstH+i, histRev[i] ? _fmR((histWC[i]||0)/histRev[i]*100) : 1));
  (sc.wcChangePct||[]).forEach((p, i) => S(10, firstF+i, p));

  S(11, LC, 'D&A (абс.), ' + (d.currencyUnit||'млн'));
  (d.historical?.da||[]).forEach((v, i) => S(11, firstH+i, v));
  (sc.daAbsolute||[]).forEach((v, i) => S(11, firstF+i, v));

  S(12, LC, 'Проценты (абс.), ' + (d.currencyUnit||'млн'));
  (d.historical?.interest||[]).forEach((v, i) => S(12, firstH+i, v));
  (sc.interestSchedule||[]).forEach((v, i) => S(12, firstF+i, v));

  S(13, LC, 'Ставка налога на прибыль, %');
  S(13, firstH, sc.taxRate || d.historical?.taxRate || 20);

  S(14, LC, '');

  // ── ROW 15: P&L SECTION ──
  S(15, LC, '── P&L / FCF ──');
  histYears.forEach((y, i) => S(15, firstH+i, `${y} (факт)`));
  foreYears.forEach((y, i) => S(15, firstF+i, `${y} (прогноз)`));

  // ROW 16: REVENUE
  S(16, LC, 'Выручка');
  (d.historical?.revenue||[]).forEach((r, i) => S(16, firstH+i, r));
  foreYears.forEach((y, i) => {
    const fc = firstF + i;
    const prevR = i===0 ? R(16, firstF-1) : R(16, fc-1);
    F_(16, fc, `=${prevR}*(1+${R(6,fc)}/100)`);
  });

  // ROW 17: Revenue growth %
  S(17, LC, '  рост, %');
  histYears.forEach((y, i) => {
    if (i===0) { S(17, firstH, '—'); return; }
    F_(17, firstH+i, `=(${R(16,firstH+i)}/${R(16,firstH+i-1)}-1)*100`);
  });
  foreYears.forEach((y, i) => {
    const fc = firstF+i;
    const prevR = i===0 ? R(16, firstF-1) : R(16, fc-1);
    F_(17, fc, `=(${R(16,fc)}/${prevR}-1)*100`);
  });

  S(18, LC, '');

  // ROW 19: COGS
  S(19, LC, 'Себестоимость');
  (d.historical?.cogs || histRev.map((r,i) => r*(1-(d.historical?.grossMargin?.[i]||35)/100))).forEach((c, i) => S(19, firstH+i, -Math.round(c)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(19, fc, `=-${R(16,fc)}*(1-${R(7,fc)}/100)`); });

  // ROW 20: Gross Profit
  S(20, LC, 'Валовая прибыль');
  (d.historical?.grossProfit || histRev.map((r,i) => r*(d.historical?.grossMargin?.[i]||35)/100)).forEach((g, i) => S(20, firstH+i, Math.round(g)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(20, fc, `=${R(16,fc)}+${R(19,fc)}`); });

  // ROW 21: GM%
  S(21, LC, '  GM, %');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(21, c, `=${R(20,c)}/${R(16,c)}*100`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(21, fc, `=${R(20,fc)}/${R(16,fc)}*100`); });

  // ROW 22: OPEX (derived: GP - EBITDA = Rev*(GM%-EBITDA%)/100)
  S(22, LC, 'OPEX (без D&A)');
  (d.historical?.opex || histRev.map((r,i) => r*((d.historical?.grossMargin?.[i]||35)-(d.historical?.ebitdaMargin?.[i]||15))/100)).forEach((o, i) => S(22, firstH+i, -Math.round(o)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(22, fc, `=-${R(16,fc)}*(${R(7,fc)}-${R(8,fc)})/100`); });

  // ROW 23: EBITDA
  S(23, LC, 'EBITDA');
  (d.historical?.ebitda || histRev.map((r,i) => r*(d.historical?.ebitdaMargin?.[i]||15)/100)).forEach((e, i) => S(23, firstH+i, Math.round(e)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(23, fc, `=${R(16,fc)}*${R(8,fc)}/100`); });

  // ROW 24: EBITDA%
  S(24, LC, '  EBITDA margin, %');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(24, c, `=${R(23,c)}/${R(16,c)}*100`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(24, fc, `=${R(23,fc)}/${R(16,fc)}*100`); });

  // ROW 25: D&A (negated from row 11)
  S(25, LC, 'D&A');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(25, c, `=-${R(11,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(25, fc, `=-${R(11,fc)}`); });

  // ROW 26: EBIT
  S(26, LC, 'EBIT');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(26, c, `=${R(23,c)}+${R(25,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(26, fc, `=${R(23,fc)}+${R(25,fc)}`); });

  // ROW 27: Interest (negated from row 12)
  S(27, LC, 'Процентные расходы');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(27, c, `=-${R(12,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(27, fc, `=-${R(12,fc)}`); });

  // ROW 28: EBT
  S(28, LC, 'EBT');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(28, c, `=${R(26,c)}+${R(27,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(28, fc, `=${R(26,fc)}+${R(27,fc)}`); });

  // ROW 29: Tax
  const taxRef = R(13, firstH);
  S(29, LC, 'Налог на прибыль');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(29, c, `=IF(${R(28,c)}>0,-${R(28,c)}*$${_fmC(firstH)}$13/100,0)`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(29, fc, `=IF(${R(28,fc)}>0,-${R(28,fc)}*$${_fmC(firstH)}$13/100,0)`); });

  // ROW 30: Net Income
  S(30, LC, 'Чистая прибыль');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(30, c, `=${R(28,c)}+${R(29,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(30, fc, `=${R(28,fc)}+${R(29,fc)}`); });

  // ROW 31: NP%
  S(31, LC, '  NP margin, %');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(31, c, `=${R(30,c)}/${R(16,c)}*100`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(31, fc, `=${R(30,fc)}/${R(16,fc)}*100`); });

  S(32, LC, '');

  // ROW 33: CAPEX
  S(33, LC, 'CAPEX');
  (d.historical?.capex||[]).forEach((c, i) => S(33, firstH+i, -Math.round(c)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(33, fc, `=-${R(16,fc)}*${R(9,fc)}/100`); });

  // ROW 34: WC Change
  S(34, LC, 'Изменение оборотного капитала');
  (d.historical?.wcChange||[]).forEach((w, i) => S(34, firstH+i, -Math.round(w)));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(34, fc, `=-${R(16,fc)}*${R(10,fc)}/100`); });

  // ROW 35: FCF = NI + D&A_addback + CAPEX(neg) + WC(neg)
  // D&A row 25 = -D&A_abs (negative), so to add back: -R(25) = D&A_abs
  // CAPEX row 33 = -CAPEX_abs (negative), WC row 34 = -WC_abs (negative)
  // FCF = NI - row25 + row33 + row34
  S(35, LC, 'Free Cash Flow');
  [firstH, firstH+1, firstH+2].slice(0, H).forEach(c => F_(35, c, `=${R(30,c)}-${R(25,c)}+${R(33,c)}+${R(34,c)}`));
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(35, fc, `=${R(30,fc)}-${R(25,fc)}+${R(33,fc)}+${R(34,fc)}`); });

  S(36, LC, '');

  // ── DCF SECTION ──
  S(37, LC, '── DCF ОЦЕНКА ──');
  S(38, LC, 'WACC, %');
  S(38, firstH, sc.wacc || 12);
  S(39, LC, 'Темп роста (terminal), %');
  S(39, firstH, sc.terminalGrowth || 2.5);
  S(40, LC, '');

  // ROW 41: Discount factors
  S(41, LC, 'Фактор дисконтирования');
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(41, fc, `=1/(1+$${_fmC(firstH)}$38/100)^${i+1}`); });

  // ROW 42: PV FCF
  S(42, LC, 'PV FCF');
  foreYears.forEach((_, i) => { const fc=firstF+i; F_(42, fc, `=${R(35,fc)}*${R(41,fc)}`); });

  S(43, LC, '');

  // Summary DCF
  const pvFcfRange = `${_fmC(firstF)}42:${_fmC(lastF)}42`;
  S(44, LC, 'Сумма PV FCF');
  F_(44, firstH, `=SUM(${pvFcfRange})`);

  S(45, LC, 'FCF терминального периода');
  F_(45, firstH, `=${R(35, lastF)}*(1+$${_fmC(firstH)}$39/100)`);

  S(46, LC, 'Terminal Value');
  F_(46, firstH, `=${R(45,firstH)}/($${_fmC(firstH)}$38/100-$${_fmC(firstH)}$39/100)`);

  S(47, LC, 'PV Terminal Value');
  F_(47, firstH, `=${R(46,firstH)}/(1+$${_fmC(firstH)}$38/100)^${F}`);

  S(48, LC, 'Enterprise Value (DCF)');
  F_(48, firstH, `=${R(44,firstH)}+${R(47,firstH)}`);

  S(49, LC, '');
  S(50, LC, 'Минус долг (факт)');
  S(50, firstH, -(d.historical?.debt || 0));

  S(51, LC, 'Плюс денежные средства (факт)');
  S(51, firstH, d.historical?.cash || 0);

  S(52, LC, 'EQUITY VALUE');
  F_(52, firstH, `=${R(48,firstH)}+${R(50,firstH)}+${R(51,firstH)}`);

  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:52, c:lastF}});
  ws['!cols'] = [{wch:38}, ...Array(H+F).fill({wch:15})];

  return ws;
}

function _fmBuildSummarySheet(d, project) {
  const keys = ['pessimistic','base','optimistic'];
  const validKeys = keys.filter(k => d.scenarios?.[k]);
  const H = (d.historicalYears||[]).length;
  const ws = {};
  const S = (r, c, v) => _fmCell(ws, r, c, v, false);
  const F_ = (r, c, f) => _fmCell(ws, r, c, f, true);
  const sheetNames = { pessimistic: 'Пессимист', base: 'Реалист', optimistic: 'Оптимист' };
  const firstH = 1;

  S(1, 0, `Due Diligence — Финансовая модель`);
  S(2, 0, `${d.company || project.name} · ${d.forecastYears?.length||0} лет прогноза · ${new Date().toLocaleDateString('ru-RU')}`);
  S(3, 0, '');
  S(4, 0, '── СВОДНАЯ ТАБЛИЦА СЦЕНАРИЕВ ──');
  S(4, 0, 'Показатель');
  validKeys.forEach((k, i) => S(4, firstH+i, `${sheetNames[k]} (${d.scenarios[k].probability}%)`));

  const metricRows = [
    ['Вероятность, %', k => d.scenarios[k].probability],
    ['WACC, %', k => d.scenarios[k].wacc],
    ['Терм. рост g, %', k => d.scenarios[k].terminalGrowth],
    ['CAGR выручки (прогноз), %', k => { const g=d.scenarios[k].revenueGrowth||[]; return g.length ? _fmR(g.reduce((a,b)=>a+b,0)/g.length) : '—'; }],
    ['EBITDA margin (ср.), %', k => { const m=d.scenarios[k].ebitdaMargin||[]; return m.length ? _fmR(m.reduce((a,b)=>a+b,0)/m.length) : '—'; }],
    ['', () => ''],
    ['Equity Value, ' + (d.currencyUnit||'млн'), k => Math.round(_fmComputeEquityValue(d, k))],
    ['EV (до вычета долга), ' + (d.currencyUnit||'млн'), k => Math.round(_fmComputeEquityValue(d,k) + (d.historical?.debt||0) - (d.historical?.cash||0))],
  ];

  metricRows.forEach((row, i) => {
    const r = 5 + i;
    S(r, 0, row[0]);
    validKeys.forEach((k, ci) => { const v = row[1](k); if (v !== null && v !== undefined) S(r, firstH+ci, v); });
  });

  const wRow = 14;
  S(wRow, 0, '');
  S(wRow+1, 0, '── ВЗВЕШЕННАЯ ОЦЕНКА ──');
  S(wRow+2, 0, 'Вероятностно-взвешенная Equity Value');
  const evVals = validKeys.map(k => Math.round(_fmComputeEquityValue(d, k)));
  const probs = validKeys.map(k => (d.scenarios[k].probability||0)/100);
  const weightedEV = evVals.reduce((sum, ev, i) => sum + ev*probs[i], 0);
  S(wRow+2, firstH, Math.round(weightedEV));

  const sellerPrice = parseFloat(project.sellerPrice) || 0;
  if (sellerPrice) {
    S(wRow+3, 0, 'Цена продавца');
    S(wRow+3, firstH, sellerPrice);
    S(wRow+4, 0, 'Дисконт / Премия к цене продавца, %');
    S(wRow+4, firstH, _fmR((weightedEV - sellerPrice)/sellerPrice*100));
    S(wRow+5, 0, weightedEV >= sellerPrice ? '✅ СДЕЛКА ПРИВЛЕКАТЕЛЬНА — взвешенная стоимость выше цены' : '⚠️ ПЕРЕСМОТР ЦЕНЫ — взвешенная стоимость ниже цены продавца');
  }

  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:wRow+6, c:validKeys.length+1}});
  ws['!cols'] = [{wch:40}, ...validKeys.map(() => ({wch:20}))];
  return ws;
}

function _fmBuildAssumptionsSheet(d) {
  const keys = ['pessimistic','base','optimistic'];
  const valid = keys.filter(k => d.scenarios?.[k]);
  const ws = {};
  const S = (r, c, v) => _fmCell(ws, r, c, v, false);

  S(1, 0, 'ДОПУЩЕНИЯ И ОБОСНОВАНИЯ');
  S(2, 0, `Компания: ${d.company||''}  ·  Горизонт: ${(d.forecastYears||[]).length} лет  ·  Валюта: ${d.currencyUnit||'млн'} ${d.currency||''}`);
  S(3, 0, '');

  const sectionNames = { pessimistic:'🔴 Пессимист', base:'🟡 Реалист', optimistic:'🟢 Оптимист' };
  const assumptions = { revenue:'Выручка', margin:'Маржинальность', capex:'CAPEX', wacc:'WACC / Ставка дисконтирования', probability:'Вероятность сценария' };

  let row = 4;
  valid.forEach(k => {
    const sc = d.scenarios[k];
    S(row, 0, `${sectionNames[k]}  (P=${sc.probability}%)`); row++;
    S(row, 0, 'Параметр'); S(row, 1, 'Значение'); S(row, 2, 'Обоснование (из заключений DD)'); row++;
    S(row, 0, 'WACC, %'); S(row, 1, sc.wacc); S(row, 2, sc.assumptions?.wacc||''); row++;
    S(row, 0, 'Terminal Growth, %'); S(row, 1, sc.terminalGrowth); S(row, 2, ''); row++;
    S(row, 0, 'CAGR выручки (ср.), %');
    const g = sc.revenueGrowth||[];
    S(row, 1, g.length ? _fmR(g.reduce((a,b)=>a+b,0)/g.length) : '');
    S(row, 2, sc.assumptions?.revenue||''); row++;
    S(row, 0, 'EBITDA margin (ср.), %');
    const m = sc.ebitdaMargin||[];
    S(row, 1, m.length ? _fmR(m.reduce((a,b)=>a+b,0)/m.length) : '');
    S(row, 2, sc.assumptions?.margin||''); row++;
    S(row, 0, 'CAPEX / Выручка (ср.), %');
    const cp = sc.capexPct||[];
    S(row, 1, cp.length ? _fmR(cp.reduce((a,b)=>a+b,0)/cp.length) : '');
    S(row, 2, sc.assumptions?.capex||''); row++;
    S(row, 0, 'Вероятность сценария'); S(row, 1, sc.probability+'%'); S(row, 2, sc.assumptions?.probability||''); row++;
    S(row, 0, ''); row++;
  });

  // Historical data section
  S(row, 0, '── ИСТОРИЧЕСКИЕ ДАННЫЕ (факт) ──'); row++;
  S(row, 0, 'Показатель');
  (d.historicalYears||[]).forEach((y, i) => S(row, 1+i, y));
  row++;
  const histRows = [
    ['Выручка', d.historical?.revenue],
    ['Gross Margin, %', d.historical?.grossMargin],
    ['EBITDA', d.historical?.ebitda],
    ['EBITDA margin, %', d.historical?.ebitdaMargin],
    ['Чистая прибыль', d.historical?.netIncome],
    ['CAPEX', d.historical?.capex],
    ['FCF', d.historical?.fcf],
    ['Долг (net)', [d.historical?.debt]],
  ];
  histRows.forEach(([label, vals]) => {
    S(row, 0, label);
    (vals||[]).forEach((v, i) => { if (v!==undefined && v!==null) S(row, 1+i, v); });
    row++;
  });

  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:row+1, c:5}});
  ws['!cols'] = [{wch:35}, {wch:18}, {wch:60}];
  return ws;
}

function _fmBuildMetricsSheet(d, project) {
  const keys = ['pessimistic','base','optimistic'];
  const valid = keys.filter(k => d.scenarios?.[k]);
  const ws = {};
  const S = (r, c, v) => _fmCell(ws, r, c, v, false);
  const F = (d.forecastYears||[]).length;

  S(1, 0, 'ИНВЕСТИЦИОННЫЕ МЕТРИКИ И ЧУВСТВИТЕЛЬНОСТЬ');
  S(2, 0, `${d.company||project.name}  ·  Горизонт: ${F} лет`);
  S(3, 0, '');

  // Metrics table
  S(4, 0, 'Показатель');
  valid.forEach((k, i) => S(4, 1+i, `${d.scenarios[k].name} (${d.scenarios[k].probability}%)`));
  S(4, 1+valid.length, 'Взвешенная');

  const evVals = valid.map(k => _fmComputeEquityValue(d, k));
  const entVals = evVals.map((ev, i) => ev + (d.historical?.debt||0) - (d.historical?.cash||0));
  const probs = valid.map(k => (d.scenarios[k].probability||0)/100);
  const weightedEV = evVals.reduce((sum, v, i) => sum + v*probs[i], 0);
  const weightedEnt = entVals.reduce((sum, v, i) => sum + v*probs[i], 0);

  const rows5 = [
    ['Equity Value, ' + (d.currencyUnit||'млн'), evVals.map(v => Math.round(v)), Math.round(weightedEV)],
    ['Enterprise Value, ' + (d.currencyUnit||'млн'), entVals.map(v => Math.round(v)), Math.round(weightedEnt)],
  ];
  // EV/EBITDA: EV / last historical EBITDA
  const lastEbitda = (d.historical?.ebitda||[])[( d.historical?.ebitda?.length||1)-1] || 1;
  rows5.push(['EV/EBITDA (текущий год), x', entVals.map(v => _fmR(v/lastEbitda)), _fmR(weightedEnt/lastEbitda)]);

  const sellerPrice = parseFloat(project.sellerPrice) || null;
  if (sellerPrice) {
    rows5.push(['IRR (от цены продавца), %', evVals.map(ev => _fmR((Math.pow(ev/sellerPrice, 1/F)-1)*100)), _fmR((Math.pow(weightedEV/sellerPrice, 1/F)-1)*100)]);
    rows5.push(['NPV (от цены продавца), ' + (d.currencyUnit||'млн'), evVals.map(ev => Math.round(ev - sellerPrice)), Math.round(weightedEV - sellerPrice)]);
    rows5.push(['Дисконт / Премия к цене, %', evVals.map(ev => _fmR((ev-sellerPrice)/sellerPrice*100)), _fmR((weightedEV-sellerPrice)/sellerPrice*100)]);
  }

  rows5.forEach((row, i) => {
    const r = 5 + i;
    S(r, 0, row[0]);
    row[1].forEach((v, ci) => S(r, 1+ci, v));
    S(r, 1+valid.length, row[2]);
  });

  // Sensitivity: WACC x Terminal Growth → Equity Value (base scenario)
  const baseSc = d.scenarios?.base;
  if (baseSc) {
    const sensRow = 5 + rows5.length + 2;
    S(sensRow, 0, '── ЧУВСТВИТЕЛЬНОСТЬ Equity Value (базовый сценарий) ──');
    S(sensRow+1, 0, 'WACC \\ g');
    const waccRange = [9, 10, 11, 12, 13, 14, 15];
    const tgRange = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5];
    waccRange.forEach((w, ci) => S(sensRow+1, 1+ci, w+'%'));
    tgRange.forEach((tg, ri) => {
      S(sensRow+2+ri, 0, tg+'%');
      waccRange.forEach((wacc, ci) => {
        const modSc = {...baseSc, wacc, terminalGrowth: tg};
        const modD = {...d, scenarios: {...d.scenarios, base: modSc}};
        S(sensRow+2+ri, 1+ci, Math.round(_fmComputeEquityValue(modD, 'base')));
      });
    });
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:sensRow+2+tgRange.length, c:1+waccRange.length}});
  } else {
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:5+rows5.length+2, c:valid.length+2}});
  }
  ws['!cols'] = [{wch:40}, ...Array(8).fill({wch:16})];
  return ws;
}

function exportFinModelXlsx(projectId, modelIdx) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  const model = project.finModels?.[modelIdx ?? 0];
  if (!model) { showToast('Нет данных финмодели', 'error'); return; }
  const d = model.data;

  try {
    if (typeof XLSX === 'undefined') { showToast('SheetJS не загружен', 'error'); return; }
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, _fmBuildSummarySheet(d, project), 'Сводка');
    XLSX.utils.book_append_sheet(wb, _fmBuildAssumptionsSheet(d), 'Допущения');

    const scMap = { pessimistic:'Пессимист', base:'Реалист', optimistic:'Оптимист' };
    ['pessimistic','base','optimistic'].forEach(sk => {
      if (d.scenarios?.[sk]) {
        const ws = _fmBuildScenarioSheet(d, sk);
        if (ws) XLSX.utils.book_append_sheet(wb, ws, scMap[sk]);
      }
    });

    XLSX.utils.book_append_sheet(wb, _fmBuildMetricsSheet(d, project), 'Метрики');

    const fname = `DD_FinModel_${(project.name||'').replace(/[^a-zа-яё0-9]/gi,'_').slice(0,30)}_${new Date().toISOString().slice(0,10)}.xlsx`;
    XLSX.writeFile(wb, fname);
    showToast('✅ Excel скачан: ' + fname, 'success', 5000);
  } catch(e) {
    showToast('Ошибка генерации Excel: ' + e.message, 'error', 8000);
    console.error('Excel error:', e);
  }
}

// FEATURE: GANTT TIMELINE
// ══════════════════════════════════════════════════════════════

const GANTT_PHASES_DEFAULT = [
  {id:'prep',     name:'Подготовка',          days:5,  color:'#3B82F6'},
  {id:'field',    name:'Полевая работа',       days:14, color:'#8B5CF6'},
  {id:'analysis', name:'Анализ данных',        days:7,  color:'#F59E0B'},
  {id:'report',   name:'Отчётность',           days:7,  color:'#10B981'},
  {id:'close',    name:'Закрытие сделки',      days:5,  color:'#EF4444'},
];

function getGanttPhases(project) {
  if (project.ganttPhases?.length) return project.ganttPhases;
  const start = new Date(project.createdAt || Date.now());
  let cur = new Date(start);
  return GANTT_PHASES_DEFAULT.map(p => {
    const s = cur.toISOString().slice(0,10);
    cur = new Date(cur.getTime() + p.days * 86400000);
    return {...p, start: s, end: cur.toISOString().slice(0,10)};
  });
}

function saveGanttPhase(projectId, phaseId, field, value) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!project.ganttPhases) project.ganttPhases = getGanttPhases(project);
  const phase = project.ganttPhases.find(p => p.id === phaseId);
  if (phase) { phase[field] = value; saveState(); render(); }
}

function renderGanttSection(project) {
  const phases = getGanttPhases(project);
  const today = new Date().toISOString().slice(0,10);

  // Compute overall range
  const allDates = phases.flatMap(p => [p.start, p.end]).filter(Boolean).sort();
  const minDate = new Date(allDates[0] || today);
  const maxDate = new Date(allDates[allDates.length-1] || today);
  const totalMs = Math.max(maxDate - minDate, 1);

  const todayMs = new Date(today) - minDate;
  const todayPct = Math.min(100, Math.max(0, todayMs / totalMs * 100));

  const phaseRows = phases.map(p => {
    const pStart = new Date(p.start || today);
    const pEnd = new Date(p.end || today);
    const leftPct = Math.max(0, (pStart - minDate) / totalMs * 100);
    const widthPct = Math.max(1, (pEnd - pStart) / totalMs * 100);
    const isPast = p.end && p.end < today;
    const isActive = p.start <= today && p.end >= today;
    return `<div class="flex items-center gap-3 mb-1.5">
      <div class="w-32 text-xs text-slate-400 flex-shrink-0 text-right pr-2">${p.name}</div>
      <div class="flex-1 relative" style="height:20px">
        <div class="absolute inset-0 bg-slate-800 rounded"></div>
        <div class="absolute rounded" style="left:${leftPct}%;width:${widthPct}%;height:100%;background:${p.color};opacity:${isPast?0.4:1}"></div>
        ${isActive ? `<div class="absolute rounded" style="left:${leftPct}%;width:${widthPct}%;height:100%;background:${p.color};animation:pulse 2s infinite"></div>` : ''}
        <div class="absolute top-0 bottom-0 w-px bg-yellow-400" style="left:${todayPct}%;z-index:10" title="Сегодня"></div>
      </div>
      <div class="flex gap-1 flex-shrink-0">
        <input type="date" class="text-xs bg-transparent border border-slate-700 rounded px-1 py-0.5 text-slate-400 w-28" value="${p.start||''}" onchange="saveGanttPhase('${project.id}','${p.id}','start',this.value)">
        <span class="text-xs text-slate-600">–</span>
        <input type="date" class="text-xs bg-transparent border border-slate-700 rounded px-1 py-0.5 text-slate-400 w-28" value="${p.end||''}" onchange="saveGanttPhase('${project.id}','${p.id}','end',this.value)">
      </div>
    </div>`;
  }).join('');

  // Month labels
  const monthLabels = [];
  const cur = new Date(minDate);
  while (cur <= maxDate) {
    const pct = (cur - minDate) / totalMs * 100;
    monthLabels.push(`<div class="absolute text-xs text-slate-600" style="left:${pct}%">${cur.toLocaleDateString('ru-RU',{month:'short'})}</div>`);
    cur.setMonth(cur.getMonth() + 1);
  }

  return `<div class="card p-4 mt-4">
    <div class="flex items-center justify-between mb-3">
      <div class="text-xs text-slate-400">Таймлайн DD</div>
      ${project.ganttPhases ? `<button onclick="getProject().ganttPhases=null;saveState();render()" class="btn-ghost text-xs px-2 py-0.5 text-slate-500">↺ Сброс</button>` : ''}
    </div>
    <div class="mb-1 relative h-4 flex items-end ml-32">
      ${monthLabels.join('')}
      <div class="absolute h-full w-px bg-yellow-400/50" style="left:${todayPct}%" title="Сегодня: ${today}"></div>
    </div>
    ${phaseRows}
    <div class="mt-2 ml-32 pl-2 flex gap-2 flex-wrap">
      <span class="text-xs text-yellow-300">▏ Сегодня: ${new Date(today).toLocaleDateString('ru-RU')}</span>
      ${project.deadline ? `<span class="text-xs text-slate-400">· Дедлайн DD: ${new Date(project.deadline).toLocaleDateString('ru-RU')}</span>` : ''}
    </div>
  </div>`;
}

function renderAgentNotesPanel(project, agentId) {
  const notes = project.agentNotes?.[agentId] || [];
  const noteInputId = `note-input-${agentId}`;
  return `<div class="border-t border-slate-700/50 px-4 py-3 no-print">
    <div class="text-xs text-slate-500 mb-2">📝 Заметки аналитика${notes.length ? ` (${notes.length})` : ''}</div>
    ${notes.map(n => `<div class="flex gap-2 mb-1.5 group">
      <div class="flex-1 text-xs text-slate-300 bg-slate-800/50 rounded px-2 py-1.5 leading-relaxed">${escHtml(n.text)}<span class="text-slate-600 ml-2">${new Date(n.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
      <button onclick="deleteAgentNote('${project.id}','${agentId}','${n.id}')" class="text-slate-700 hover:text-red-400 text-sm opacity-0 group-hover:opacity-100 transition-opacity">×</button>
    </div>`).join('')}
    <div class="flex gap-2 mt-1">
      <input id="${noteInputId}" type="text" class="input text-xs flex-1 py-1.5" placeholder="Добавить заметку / комментарий к разделу..." onkeydown="if(event.key==='Enter'){addAgentNote('${project.id}','${agentId}',this.value);this.value=''}">
      <button onclick="const el=document.getElementById('${noteInputId}');addAgentNote('${project.id}','${agentId}',el.value);el.value=''" class="btn-secondary text-xs px-3 py-1.5">+ Добавить</button>
    </div>
  </div>`;
}

function addAgentNote(projectId, agentId, text) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || !text?.trim()) return;
  if (!project.agentNotes) project.agentNotes = {};
  if (!project.agentNotes[agentId]) project.agentNotes[agentId] = [];
  project.agentNotes[agentId].push({id: generateId(), text: text.trim(), ts: new Date().toISOString()});
  saveState(); render();
}

function deleteAgentNote(projectId, agentId, noteId) {
  const project = state.projects.find(p => p.id === projectId);
  if (project?.agentNotes?.[agentId]) {
    project.agentNotes[agentId] = project.agentNotes[agentId].filter(n => n.id !== noteId);
    saveState(); render();
  }
}

async function generateEnglishSummary(projectId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || state.enSummaryRunning) return;
  if (!state.settings.claudeKey) { showToast('Нет API ключа', 'error'); return; }

  const completedAgents = AGENTS.filter(a => project.conclusions?.[a.id]?.text);
  if (!completedAgents.length) { showToast('Нет заключений агентов', 'error'); return; }

  state.enSummaryRunning = true;
  render();

  try {
    const conclusionsText = completedAgents.map(a =>
      `## ${a.name.toUpperCase()} (${a.short})\n${project.conclusions[a.id].text.substring(0, 2000)}`
    ).join('\n\n---\n\n');

    const sysPrompt = `You are a senior investment banking analyst (Goldman Sachs / McKinsey level).
Write a professional Executive Summary in English based on the provided Due Diligence conclusions.

Format the summary as follows:

## EXECUTIVE SUMMARY
[2-3 sentence investment thesis]

## TRANSACTION OVERVIEW
[Deal type, parties, key parameters]

## KEY FINDINGS
### Commercial
[2-3 bullet points from marketing/commercial analysis]

### Financial
[2-3 bullet points — key financials, valuation range]

### Legal & Tax
[2-3 bullet points — critical legal/tax risks]

### Operational
[2-3 bullet points — operational risks and capex needs]

## RISK MATRIX (Top 5)
[Table: Risk | Probability | Impact | Mitigation]

## VALUATION SUMMARY
[Price range, methodology, key value drivers]

## RECOMMENDATION
**PROCEED / RENEGOTIATE PRICE / WALK AWAY**
[1-paragraph rationale]

Write in professional investment banking English. Be concise — target 1.5-2 pages.`;

    const userContent = `Project: ${project.name}
Industry: ${project.industry || 'N/A'}
Deal Type: ${project.dealType || 'N/A'}
${project.sellerPrice ? `Seller's Asking Price: $${project.sellerPrice}M` : ''}
${project.targetPrice ? `Target Price: $${project.targetPrice}M` : ''}

DUE DILIGENCE CONCLUSIONS:

${conclusionsText}`;

    const text = await callClaude(sysPrompt, userContent);
    project.executiveSummaryEN = {text, createdAt: new Date().toISOString()};

    showToast('✅ English Executive Summary готов', 'success');

    showToast('❌ Ошибка: ' + e.message, 'error', 6000);
  }

  state.enSummaryRunning = false;
  render();
}

function printEnglishSummary(projectId) {

  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
