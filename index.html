function loadState() {
  try {
    const saved = localStorage.getItem('dd-office-v2');
    if (saved) { const s = JSON.parse(saved); state.projects = s.projects || []; }
    const settings = localStorage.getItem('dd-office-settings-v2');
    if (settings) state.settings = { ...state.settings, ...JSON.parse(settings) };
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem('dd-office-v2', JSON.stringify({ projects: state.projects }));
    localStorage.setItem('dd-office-settings-v2', JSON.stringify(state.settings));
  } catch (e) {}
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

function getProject() { return state.projects.find(p => p.id === state.currentProjectId); }

function getProgress(project) {
  const done = AGENTS.filter(a => project.conclusions?.[a.id]?.text).length;
  return Math.round((done / AGENTS.length) * 100);
}

function statusClass(status) {
  if (status === 'Активный') return 'status-active';
  if (status === 'Завершён') return 'status-done';
  if (status === 'Пауза') return 'status-paused';
  if (status === 'Отменён') return 'status-cancelled';
  return 'status-active';
}

// ══════════════════════════════════════════════════════════════
// FILE EXTRACTION
// ══════════════════════════════════════════════════════════════

async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt') {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.onerror = reject;
      r.readAsText(file, 'UTF-8');
    });
  }
  if (ext === 'pdf') {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js не загружен');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = `[PDF: ${file.name}, ${pdf.numPages} стр.]\n`;
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const ct = await pg.getTextContent();
      text += ct.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }
  if (ext === 'xlsx' || ext === 'xls') {
    if (typeof XLSX === 'undefined') throw new Error('SheetJS не загружен');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    let text = `[Excel: ${file.name}]\n`;
    wb.SheetNames.forEach(sn => {
      text += `\n=== Лист: ${sn} ===\n`;
      text += XLSX.utils.sheet_to_csv(wb.Sheets[sn]);
    });
    return text;
  }
  if (ext === 'docx') {
    if (typeof mammoth === 'undefined') throw new Error('Mammoth не загружен');
    const buf = await file.arrayBuffer();
    const res = await mammoth.extractRawText({ arrayBuffer: buf });
    return `[Word: ${file.name}]\n` + res.value;
  }
  throw new Error(`Формат .${ext} не поддерживается`);
}

// CLAUDE API
// ══════════════════════════════════════════════════════════════

async function callClaude(systemPrompt, userContent) {
  const key = state.settings.claudeKey;
  if (!key) throw new Error('API ключ не настроен. Перейдите в ⚙️ Настройки.');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-allow-browser': 'true',
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model: state.settings.claudeModel || 'claude-sonnet-4-6',
      max_tokens: 4000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userContent }]
    })
  });
  if (!res.ok) {
    let msg = 'Ошибка Claude API';
    try { const err = await res.json(); msg = err.error?.message || msg; } catch(e) {}
    throw new Error(msg);
  }
  const data = await res.json();
  return data.content[0].text;
}

function buildContext(project) {
  let ctx = `ПРОЕКТ: ${project.name}\n`;
  if (project.client) ctx += `КЛИЕНТ: ${project.client}\n`;
  if (project.dealType) ctx += `ТИП СДЕЛКИ: ${project.dealType}\n`;
  if (project.industry) ctx += `ОТРАСЛЬ: ${project.industry}\n`;
  if (project.depth) ctx += `ГЛУБИНА АНАЛИЗА: ${project.depth}\n`;
  if (project.sellerPrice) ctx += `ЦЕНА ПРОДАВЦА: $${project.sellerPrice} млн\n`;
  if (project.targetPrice) ctx += `ЦЕЛЕВАЯ ЦЕНА: $${project.targetPrice} млн\n`;
  ctx += `\nЗАДАЧА:\n${project.task || 'Провести полный DD анализ'}\n`;
  if (project.files?.length) {
    ctx += `\n${'='.repeat(50)}\nМАТЕРИАЛЫ ПРОЕКТА:\n${'='.repeat(50)}\n`;
    project.files.forEach(f => {
      ctx += `\n[Файл: ${f.name}]\n${(f.text || '').substring(0, 15000)}\n`;
    });
  }
  return ctx;
}

function buildContextWithConclusions(project, upToIndex) {
  let ctx = buildContext(project);
  const done = AGENTS.slice(0, upToIndex).filter(a => project.conclusions?.[a.id]?.text);
  if (done.length) {
    ctx += `\n${'='.repeat(50)}\nЗАКЛЮЧЕНИЯ КОМАНДЫ:\n${'='.repeat(50)}\n`;
    done.forEach(a => {
      ctx += `\n${a.icon} ${a.name.toUpperCase()}:\n${project.conclusions[a.id].text}\n`;
    });
  }
  return ctx;
}

async function runAgent(project, agentId) {
  const agentIndex = AGENTS.findIndex(a => a.id === agentId);
  const agent = AGENTS[agentIndex];
  const needsConclusions = agentId === 'risk' || agentId === 'ceo';
  const ctx = needsConclusions ? buildContextWithConclusions(project, agentIndex) : buildContext(project);
  const text = await callClaude(agent.systemPrompt, ctx);
  if (!project.conclusions) project.conclusions = {};
  project.conclusions[agentId] = { text, timestamp: new Date().toISOString() };
  saveState();
}

async function runAllAgents(projectId) {
  if (state.runningAgent) return;
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!state.settings.claudeKey) { showToast('Сначала добавьте Claude API ключ в Настройках', 'error'); navigate('settings'); return; }

  for (let i = 0; i < AGENTS.length; i++) {
    const agent = AGENTS[i];
    state.runningAgent = agent.id;
    render();
    try {
      await runAgent(project, agent.id);
      showToast(`${agent.icon} ${agent.name}: заключение получено`, 'success', 2000);
    } catch (e) {
      showToast(`${agent.icon} ${agent.name}: ошибка — ${e.message}`, 'error', 5000);
      state.runningAgent = null;
      render();
      return;
    }
  }
  state.runningAgent = null;
  project.status = 'Завершён';
  saveState();
  showToast('✅ DD анализ завершён! Вердикт CEO готов.', 'success', 6000);
  state.currentTab = 'report';
  render();
}

async function runSingleAgent(projectId, agentId) {
  if (state.runningAgent) return;
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!state.settings.claudeKey) { showToast('Сначала добавьте Claude API ключ в Настройках', 'error'); navigate('settings'); return; }
  const agent = AGENTS.find(a => a.id === agentId);
  state.runningAgent = agentId;
  render();
  try {
    await runAgent(project, agentId);
    showToast(`${agent.icon} ${agent.name}: заключение получено`, 'success');
  } catch (e) {
    showToast(`Ошибка: ${e.message}`, 'error', 5000);
  }
  state.runningAgent = null;
  render();
}

async function notionReq(endpoint, method, body) {
  const token = state.settings.notionToken;
  if (!token) throw new Error('Notion токен не настроен. Перейдите в Настройки.');
  const url = `https://api.notion.com/v1${endpoint}`;
  const proxy = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, {
    method,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Notion-Version': '2022-06-28'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    let msg = 'Ошибка Notion API';
    try { const e = await res.json(); msg = e.message || msg; } catch(err) {}
    throw new Error(msg);
  }
  return res.json();
}

function notionText(str) {
  if (!str) return [];
  const chunks = [];
  for (let i = 0; i < str.length; i += 2000) chunks.push({ type: 'text', text: { content: str.slice(i, i + 2000) } });
  return chunks;
}

async function saveToNotion(project) {
  const props = {
    'Проект': { title: [{ text: { content: project.name } }] },
    'Статус': { select: { name: project.status || 'Активный' } }
  };
  if (project.client) props['Клиент'] = { rich_text: notionText(project.client) };
  if (project.task) props['Задача'] = { rich_text: notionText(project.task.substring(0, 2000)) };
  if (project.dealType) props['Тип сделки'] = { select: { name: project.dealType } };
  if (project.industry) props['Отрасль'] = { select: { name: project.industry } };
  if (project.depth) props['Глубина анализа'] = { select: { name: project.depth } };
  if (project.sellerPrice) props['Цена продавца $млн'] = { number: parseFloat(project.sellerPrice) };
  if (project.targetPrice) props['Целевая цена $млн'] = { number: parseFloat(project.targetPrice) };
  props['Прогресс %'] = { number: getProgress(project) };
  props['Заключений агентов'] = { number: AGENTS.filter(a => project.conclusions?.[a.id]?.text).length };

  const projectPage = await notionReq('/pages', 'POST', {
    parent: { database_id: NOTION_PROJECTS_DB },
    properties: props
  });
  const notionId = projectPage.id;
  project.notionId = notionId;
  saveState();

  const completed = AGENTS.filter(a => project.conclusions?.[a.id]?.text);
  for (const agent of completed) {
    const text = project.conclusions[agent.id].text;
    const blocks = [];
    for (let i = 0; i < text.length; i += 2000) {
      blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: [{ type: 'text', text: { content: text.slice(i, i + 2000) } }] } });
    }
    await notionReq('/pages', 'POST', {
      parent: { database_id: NOTION_CONCLUSIONS_DB },
      properties: {
        'Заголовок': { title: [{ text: { content: `${project.name} — ${agent.name}` } }] },
        'Агент': { select: { name: agent.name } },
        'Проект': { relation: [{ id: notionId }] },
        'Статус': { select: { name: 'Получено' } }
      },
      children: blocks.slice(0, 100)
    });
  }
  return notionId;
}

function downloadTxt(project) {
  let text = `DD ОТЧЁТ: ${project.name}\n${'='.repeat(60)}\n`;
  text += `Дата: ${new Date().toLocaleDateString('ru-RU')}\n`;
  if (project.client) text += `Клиент: ${project.client}\n`;
  if (project.dealType) text += `Тип сделки: ${project.dealType}\n`;
  if (project.industry) text += `Отрасль: ${project.industry}\n`;
  text += '\n';
  AGENTS.forEach(agent => {
    const c = project.conclusions?.[agent.id];
    if (!c?.text) return;
    text += `\n${'═'.repeat(60)}\n${agent.icon} ${agent.name.toUpperCase()}\n${'═'.repeat(60)}\n${c.text}\n`;
  });
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `DD_${project.name}_${new Date().toISOString().slice(0,10)}.txt`;
  a.click(); URL.revokeObjectURL(url);
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^• (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`);
  html = html.replace(/\|(.+)\|/g, (m, inner) => {
    const cells = inner.split('|').map(c => c.trim());
    return '<tr>' + cells.map(c => {
      if (c.match(/^[-:]+$/)) return '';
      return `<td>${c}</td>`;
    }).filter(Boolean).join('') + '</tr>';
  });
  html = html.replace(/(<tr>.*<\/tr>\n?)+/g, s => `<table>${s}</table>`);
  html = html.replace(/\n/g, '<br>');
  return html;
}

}

  else if (state.page === 'settings') html += renderSettings();

}

async function testClaudeKey() {
  const key = document.getElementById('s-claude-key').value.trim();
  if (!key) { showToast('Введите ключ', 'error'); return; }
  showToast('Проверяю ключ...', 'info', 3000);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-allow-browser': 'true', 'content-type': 'application/json' },
      body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 10, messages: [{ role: 'user', content: 'Hi' }] })
    });
    if (res.ok) showToast('✅ Claude API ключ работает!', 'success');
    else {
      let msg = 'Неверный ключ';
      try { const e = await res.json(); msg = e.error?.message || msg; } catch(_) {}
      showToast('❌ ' + msg, 'error', 7000);
    }
  } catch (e) {
    const msg = e?.message || String(e);
    if (location.protocol === 'file:') {
      showToast('❌ Откройте через HTTPS (не file://). Используйте GitHub Pages или Netlify.', 'error', 7000);
    } else {
      showToast('❌ Ошибка сети: ' + msg, 'error', 7000);
    }
  }
}

async function testNotionToken() {
  const token = document.getElementById('s-notion-token').value.trim();
  if (!token) { showToast('Введите токен', 'error'); return; }
  showToast('Проверяю токен...', 'info', 3000);
  try {
    const url = 'https://api.notion.com/v1/users/me';
    const proxy = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxy, { headers: { 'Authorization': `Bearer ${token}`, 'Notion-Version': '2022-06-28' } });
    if (res.ok) showToast('✅ Notion токен работает!', 'success');
    else showToast('❌ Неверный Notion токен', 'error', 5000);
  } catch (e) { showToast('❌ Ошибка подключения', 'error', 5000); }
}

function saveSettings() {
  state.settings.claudeKey = (document.getElementById('s-claude-key')?.value||'').trim();
  state.settings.notionToken = (document.getElementById('s-notion-token')?.value||'').trim();
  state.settings.claudeModel = document.getElementById('s-model')?.value || 'claude-sonnet-4-6';
  saveState();
  showToast('✅ Настройки сохранены', 'success');
  render();
}

  return `<div class="mb-4 flex gap-3 items-center flex-wrap">
    <button onclick="runAllAgents('${project.id}')" class="btn-primary" ${isRunning?'disabled':''}>
      ${isRunning ? `<span class="spinner mr-2"></span>Анализирует...` : '🚀 Запустить всех агентов'}
    </button>
    ${allDone ? `<button onclick="switchTab('report')" class="btn-secondary">📄 Смотреть отчёт</button>` : ''}
    ${isRunning ? `<span class="text-sm text-slate-400">Работает: ${AGENTS.find(a=>a.id===state.runningAgent)?.name||state.runningAgent}</span>` : ''}
  </div>
  <div class="grid grid-cols-2 gap-3">
    ${AGENTS.map(agent => {
      const conclusion = project.conclusions?.[agent.id];
      const running = state.runningAgent === agent.id;
      const done = !!conclusion?.text;
      const isCeo = agent.id === 'ceo';
      const isRisk = agent.id === 'risk';
      const needsOthers = (isCeo || isRisk) && !allDone;
      return `<div class="card p-4 agent-card border ${done?'border-green-800/50':running?'border-blue-500':'border-slate-700'}">
        <div class="flex items-start justify-between mb-2">
          <div class="flex items-center gap-2">
            <span class="text-xl">${agent.icon}</span>
            <div>
              <div class="font-medium text-white text-sm">${agent.name}</div>

          <div class="flex items-center gap-1">
            ${done ? `<span class="text-green-400 text-lg">✓</span>` : running ? `<span class="spinner"></span>` : ''}

function nextStep1() {
  const name = document.getElementById('np-name')?.value?.trim();
  if (!name) { showToast('Введите название проекта', 'error'); return; }
  state.newProject.data = {
    ...state.newProject.data,
    name,
    client: document.getElementById('np-client')?.value?.trim(),
    dealType: document.getElementById('np-dealtype')?.value,
    industry: document.getElementById('np-industry')?.value,
    depth: document.getElementById('np-depth')?.value,
    sellerPrice: document.getElementById('np-seller')?.value,
    targetPrice: document.getElementById('np-target')?.value
  };
  state.newProject.step = 2;
  render();
}

function nextStep2() {
  const loading = state.newProject.files.some(f => f.status === 'loading');
  if (loading) { showToast('Дождитесь загрузки файлов', 'error'); return; }
  state.newProject.step = 3;
  render();
}

function prevStep() {
  state.newProject.step = Math.max(1, state.newProject.step - 1);
  render();
}

async function handleFiles(fileList) {
  for (const file of Array.from(fileList)) {
    const entry = { name: file.name, status: 'loading', text: '', error: '' };
    state.newProject.files.push(entry);
    render();
    try {
      entry.text = await extractText(file);
      entry.status = 'done';
    } catch (e) {
      entry.status = 'error';
      entry.error = e.message;
    }
    render();
  }
}

function removeFile(index) {
  state.newProject.files.splice(index, 1);
  render();
}

function createProject() {
  const task = document.getElementById('np-task')?.value?.trim();
  if (!task) { showToast('Опишите задачу проекта', 'error'); return; }
  const project = {
    id: generateId(),
    ...state.newProject.data,
    task,
    files: state.newProject.files.filter(f => f.status === 'done').map(f => ({ name: f.name, text: f.text })),
    status: 'Активный',
    conclusions: {},
    createdAt: new Date().toISOString()
  };
  state.projects.unshift(project);
  saveState();
  showToast('✅ Проект создан!', 'success');
  state.currentProjectId = project.id;
  state.currentTab = 'agents';
  state.page = 'project';
  render();
  if (state.settings.claudeKey) {
    setTimeout(() => runAllAgents(project.id), 300);
  } else {
    showToast('⚠️ Добавьте Claude API ключ в Настройках для запуска анализа', 'error', 6000);
  }
}

function switchTab(tab) {
  state.currentTab = tab;
  render();
}

function changeProjectStatus(e) {
  const project = getProject();
  if (project) { project.status = e.target.value; saveState(); render(); }
}

function deleteProject(id) {
  if (!confirm('Удалить проект? Все заключения будут потеряны.')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  saveState();
  navigate('dashboard');
}

async function handleSaveToNotion() {
  const project = getProject();
  if (!project) return;
  const btn = document.getElementById('notion-save-btn');
  if (btn) { btn.textContent = '⏳ Сохраняю...'; btn.disabled = true; }
  try {
    const id = await saveToNotion(project);
    showToast('✅ Сохранено в Notion!', 'success');
    if (btn) { btn.textContent = '✅ Сохранено'; }
  } catch (e) {
    showToast('❌ Ошибка Notion: ' + e.message, 'error', 6000);
    if (btn) { btn.textContent = '💾 Сохранить в Notion'; btn.disabled = false; }
  }
}

// ══════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ══════════════════════════════════════════════════════════════

function attachListeners() {
  const dz = document.getElementById('drop-zone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });
  }
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

loadState();
render();
</script>
