function renderRiskMatrixTab(project) {
  const risks = project.riskItems || [];
  const running = state.riskExtracting;
  const hasRiskConclusion = !!project.conclusions?.risk?.text;

  // 5×5 grid — bucket risks by cell
  const risksByCell = {};
  risks.forEach(r => {
    const key = `${r.probability||1}-${r.impact||1}`;
    if (!risksByCell[key]) risksByCell[key] = [];
    risksByCell[key].push(r);
  });

  const cellColor = (p, i) => {
    const score = p * i;
    if (score >= 20) return '#7f1d1d'; // critical — red
    if (score >= 12) return '#7c2d12'; // high — orange-red
    if (score >= 6)  return '#78350f'; // medium — amber
    if (score >= 3)  return '#1e3a1f'; // low-medium — green-ish
    return '#0f2720';                   // low — dark green
  };
  const textColor = (p, i) => {
    const score = p * i;
    if (score >= 20) return '#fca5a5';
    if (score >= 12) return '#fdba74';
    if (score >= 6)  return '#fcd34d';
    if (score >= 3)  return '#86efac';
    return '#6ee7b7';
  };

  // Build 5×5 grid (rows=probability 5→1, cols=impact 1→5)
  let gridHtml = '<div style="display:grid;grid-template-columns:24px repeat(5,1fr);gap:2px" class="mb-6">';
  // Column headers
  gridHtml += '<div></div>';
  ['1','2','3','4','5'].forEach(n => gridHtml += `<div class="text-center text-xs text-slate-500 pb-1">Ущерб ${n}</div>`);

  for (let prob = 5; prob >= 1; prob--) {
    gridHtml += `<div class="text-xs text-slate-500 flex items-center justify-end pr-1" style="writing-mode:initial">P${prob}</div>`;
    for (let impact = 1; impact <= 5; impact++) {
      const key = `${prob}-${impact}`;
      const cell = risksByCell[key] || [];
      const bg = cellColor(prob, impact);
      const tc = textColor(prob, impact);
      gridHtml += `<div style="background:${bg};border-radius:4px;min-height:56px;padding:4px;position:relative" class="cursor-pointer" onclick="addRiskItemToCell('${project.id}',${prob},${impact})">
        ${cell.map(r => `<div style="background:rgba(255,255,255,0.12);border-radius:3px;padding:2px 4px;margin-bottom:2px;position:relative" class="group">
          <span style="font-size:10px;color:${tc};line-height:1.2;display:block">${escHtml((r.name||'').substring(0,30))}</span>
          <button onclick="event.stopPropagation();deleteRiskItem('${project.id}','${r.id}')" style="position:absolute;top:0;right:2px;color:rgba(255,255,255,0.3);font-size:12px;background:none;border:none;cursor:pointer;line-height:1" class="group-hover:opacity-100 opacity-0">×</button>
        </div>`).join('')}
      </div>`;
    }
  }
  gridHtml += '</div>';

  // Legend
  const legend = `<div class="flex gap-3 mb-5 flex-wrap">
    <div class="flex items-center gap-1.5 text-xs"><div style="width:14px;height:14px;border-radius:3px;background:#7f1d1d"></div><span class="text-slate-400">Критично (20-25)</span></div>
    <div class="flex items-center gap-1.5 text-xs"><div style="width:14px;height:14px;border-radius:3px;background:#7c2d12"></div><span class="text-slate-400">Высокий (12-19)</span></div>
    <div class="flex items-center gap-1.5 text-xs"><div style="width:14px;height:14px;border-radius:3px;background:#78350f"></div><span class="text-slate-400">Средний (6-11)</span></div>
    <div class="flex items-center gap-1.5 text-xs"><div style="width:14px;height:14px;border-radius:3px;background:#1e3a1f"></div><span class="text-slate-400">Низкий-средний (3-5)</span></div>
    <div class="flex items-center gap-1.5 text-xs"><div style="width:14px;height:14px;border-radius:3px;background:#0f2720"></div><span class="text-slate-400">Низкий (1-2)</span></div>
  </div>`;

  // Risk list
  const sortedRisks = [...risks].sort((a,b) => (b.probability||1)*(b.impact||1) - (a.probability||1)*(a.impact||1));
  const riskList = risks.length ? `<div class="card overflow-hidden">
    <div class="px-4 py-3 border-b border-slate-700 text-xs text-slate-400">Реестр рисков (${risks.length})</div>
    <table class="w-full">
      <thead><tr class="border-b border-slate-700 text-xs">
        <th class="px-3 py-2 text-left text-slate-400 font-medium">Риск</th>
        <th class="px-3 py-2 text-center text-slate-400 font-medium w-16">Вероятн.</th>
        <th class="px-3 py-2 text-center text-slate-400 font-medium w-16">Ущерб</th>
        <th class="px-3 py-2 text-center text-slate-400 font-medium w-16">Скор</th>
        <th class="px-3 py-2 text-left text-slate-400 font-medium w-24">Категория</th>
        <th class="w-8"></th>
      </tr></thead>
      <tbody>
        ${sortedRisks.map(r => {
          const score = (r.probability||1)*(r.impact||1);
          const scoreColor = score>=20?'text-red-400':score>=12?'text-orange-400':score>=6?'text-yellow-400':'text-green-400';
          return `<tr class="border-b border-slate-800 hover:bg-slate-800/30">
            <td class="px-3 py-2 text-sm text-slate-200">${escHtml(r.name||'')}</td>
            <td class="px-3 py-2 text-center">
              <select onchange="updateRiskItem('${project.id}','${r.id}','probability',+this.value)" class="bg-transparent text-xs text-slate-300 border-0 outline-none">
                ${[1,2,3,4,5].map(n=>`<option value="${n}" ${r.probability===n?'selected':''}>${n}</option>`).join('')}
              </select>
            </td>
            <td class="px-3 py-2 text-center">
              <select onchange="updateRiskItem('${project.id}','${r.id}','impact',+this.value)" class="bg-transparent text-xs text-slate-300 border-0 outline-none">
                ${[1,2,3,4,5].map(n=>`<option value="${n}" ${r.impact===n?'selected':''}>${n}</option>`).join('')}
              </select>
            </td>
            <td class="px-3 py-2 text-center text-sm font-bold ${scoreColor}">${score}</td>
            <td class="px-3 py-2 text-xs text-slate-500">${escHtml(r.category||'—')}</td>
            <td class="px-3 py-2"><button onclick="deleteRiskItem('${project.id}','${r.id}')" class="text-slate-700 hover:text-red-400 text-base">×</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>` : '';

  // Manual add form
  const addForm = `<div class="card p-3 mb-4 flex gap-2 items-end flex-wrap">
    <div class="flex-1 min-w-32">
      <div class="text-xs text-slate-500 mb-1">Название риска</div>
      <input id="risk-name" type="text" class="input text-sm" placeholder="Опиши риск кратко..." onkeydown="if(event.key==='Enter')addRiskItemManual('${project.id}')">
    </div>
    <div>
      <div class="text-xs text-slate-500 mb-1">Вероятность</div>
      <select id="risk-prob" class="input text-sm w-20">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    </div>
    <div>
      <div class="text-xs text-slate-500 mb-1">Ущерб</div>
      <select id="risk-impact" class="input text-sm w-20">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    </div>
    <div>
      <div class="text-xs text-slate-500 mb-1">Категория</div>
      <select id="risk-cat" class="input text-sm w-28">
        ${['Финансовый','Правовой','Операционный','Рыночный','Регуляторный','Налоговый','Репутационный','Другой'].map(c=>`<option>${c}</option>`).join('')}
      </select>
    </div>
    <button onclick="addRiskItemManual('${project.id}')" class="btn-primary text-sm px-4 py-2">+ Добавить</button>
  </div>`;

  return `<div>
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-base font-semibold text-white">🎯 Матрица рисков</h2>
        <div class="text-xs text-slate-400 mt-0.5">5×5 · Вероятность × Ущерб · Кликни ячейку для добавления риска</div>
      </div>
      <div class="flex gap-2">
        ${hasRiskConclusion ? `<button onclick="extractRiskMatrix('${project.id}')" class="btn-secondary text-sm" ${running?'disabled':''}>
          ${running ? '<span class="spinner mr-1"></span>Извлекаю...' : '✨ Извлечь из заключения'}
        </button>` : ''}
      </div>
    </div>
    ${addForm}
    <div class="card p-4 mb-4">
      <div class="flex text-xs text-slate-500 mb-2 ml-6">
        <div class="flex-1 text-center">← Ущерб →</div>
      </div>
      <div class="flex">
        <div class="flex flex-col justify-center mr-2 text-xs text-slate-500" style="writing-mode:vertical-rl;transform:rotate(180deg);height:${5*58}px">← Вероятность →</div>
        <div class="flex-1">${gridHtml}</div>
      </div>
    </div>
    ${legend}
    ${riskList}
  </div>`;
}

function addRiskItemToCell(projectId, probability, impact) {
  const name = prompt('Название риска:');
  if (!name?.trim()) return;
  const cat = prompt('Категория (Финансовый, Правовой, Операционный, ...):') || 'Другой';
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!project.riskItems) project.riskItems = [];
  project.riskItems.push({id: generateId(), name: name.trim(), probability, impact, category: cat.trim(), createdAt: new Date().toISOString()});
  saveState(); render();
}

function addRiskItemManual(projectId) {
  const name = document.getElementById('risk-name')?.value?.trim();
  if (!name) { showToast('Введи название риска', 'error'); return; }
  const prob = +document.getElementById('risk-prob')?.value || 3;
  const impact = +document.getElementById('risk-impact')?.value || 3;
  const cat = document.getElementById('risk-cat')?.value || 'Другой';
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!project.riskItems) project.riskItems = [];
  project.riskItems.push({id: generateId(), name, probability: prob, impact, category: cat, createdAt: new Date().toISOString()});
  saveState(); render();
  document.getElementById('risk-name').value = '';
}

function updateRiskItem(projectId, itemId, field, value) {
  const project = state.projects.find(p => p.id === projectId);
  const item = project?.riskItems?.find(r => r.id === itemId);
  if (item) { item[field] = value; saveState(); render(); }
}

function deleteRiskItem(projectId, itemId) {
  const project = state.projects.find(p => p.id === projectId);
  if (project) { project.riskItems = (project.riskItems||[]).filter(r => r.id !== itemId); saveState(); render(); }
}

async function extractRiskMatrix(projectId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || state.riskExtracting) return;
  if (!state.settings.claudeKey) { showToast('Нет API ключа', 'error'); return; }
  const riskText = project.conclusions?.risk?.text;
  if (!riskText) { showToast('Нет заключения рисковика', 'error'); return; }

  state.riskExtracting = true;
  render();

  try {
    const sysPrompt = `Ты — аналитик рисков. Извлеки риски из заключения и верни ТОЛЬКО JSON массив.
Без markdown, без пояснений — только массив [].

Формат каждого риска:
{"name":"краткое название риска (до 50 символов)","probability":1-5,"impact":1-5,"category":"Финансовый|Правовой|Операционный|Рыночный|Регуляторный|Налоговый|Репутационный|Другой"}

Шкала:
- Вероятность 1=очень низкая, 3=умеренная, 5=почти наверняка
- Ущерб 1=незначительный, 3=существенный, 5=критичный/потеря сделки

Извлеки 5-15 наиболее значимых рисков.`;

    const raw = await callClaude(sysPrompt, riskText.substring(0, 8000));
    let jsonStr = raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'').trim();
    const s = jsonStr.indexOf('['); const e = jsonStr.lastIndexOf(']');
    if (s !== -1 && e !== -1) jsonStr = jsonStr.slice(s, e+1);
    const items = JSON.parse(jsonStr);
    if (!Array.isArray(items)) throw new Error('Не массив');

    if (!project.riskItems) project.riskItems = [];
    items.forEach(item => {
      if (!item.name) return;
      if (!project.riskItems.some(r => r.name === item.name)) {
        project.riskItems.push({id: generateId(), ...item, createdAt: new Date().toISOString()});
      }
    });
    saveState();
    showToast(`✅ Извлечено ${items.length} рисков`, 'success');
  } catch(e) {
    showToast('Ошибка извлечения: ' + e.message, 'error', 6000);
  }

  state.riskExtracting = false;
  render();
}

async function sendAgentChatMessage(projectId, agentId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || state.chatRunning) return;
  const message = (document.getElementById('chat-input')?.value || state.chatInput).trim();
  if (!message) return;
  if (!state.settings.claudeKey) { showToast('Нет API ключа', 'error'); return; }
  const agent = AGENTS.find(a => a.id === agentId);
  if (!project.agentChats) project.agentChats = {};
  if (!project.agentChats[agentId]) project.agentChats[agentId] = [];
  project.agentChats[agentId].push({ role: 'user', content: message, ts: new Date().toISOString() });
  state.chatInput = '';
  state.chatRunning = true;
  render();
  try {
    const conclusion = project.conclusions?.[agentId]?.text || '';
    const systemPrompt = `Ты — ${agent.name} (${agent.short}) из DD-офиса. Ты уже подготовил заключение по проекту "${project.name}".

ТВОЁ ЗАКЛЮЧЕНИЕ:
${conclusion.substring(0, 8000)}

${buildContext(project).substring(0, 3000)}

Отвечай кратко и конкретно. Ссылайся на данные из материалов. Если информации нет — скажи честно.`;
    const messages = project.agentChats[agentId].map(m => ({ role: m.role, content: m.content }));
    const reply = await callClaudeMessages(systemPrompt, messages);
    project.agentChats[agentId].push({ role: 'assistant', content: reply, ts: new Date().toISOString() });
    saveState();
  } catch (e) {
    showToast('Ошибка: ' + e.message, 'error', 5000);
    project.agentChats[agentId].pop();
  }
  state.chatRunning = false;
  render();
  setTimeout(() => { const el = document.getElementById('chat-messages'); if(el) el.scrollTop = el.scrollHeight; }, 50);
}

function clearAgentChat(projectId, agentId) {
  const project = state.projects.find(p => p.id === projectId);
  if (project?.agentChats?.[agentId]) { project.agentChats[agentId] = []; saveState(); render(); }
}

async function runAgentSearch(projectId, agentId) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project || state.chatRunning) return;
  const query = (document.getElementById('search-input')?.value || state.searchInput).trim();
  if (!query) { showToast('Введи поисковый запрос', 'error'); return; }
  if (!state.settings.claudeKey) { showToast('Нет API ключа', 'error'); return; }
  const agent = AGENTS.find(a => a.id === agentId);
  state.searchInput = '';
  state.chatRunning = true;
  render();
  try {
    const sysPrompt = `${agent.systemPrompt}

РЕЖИМ ДОПОЛНИТЕЛЬНОГО ПОИСКА: используй инструмент веб-поиска для получения актуальных данных. Предоставь найденную информацию с источниками и сделай выводы применительно к проекту.`;
    const ctx = buildContext(project);
    const result = await callClaude(sysPrompt, `${ctx}\n\nЗАПРОС НА ПОИСК: ${query}`);
    if (!project.searchResults) project.searchResults = {};
    if (!project.searchResults[agentId]) project.searchResults[agentId] = [];
    project.searchResults[agentId].unshift({ query, result, ts: new Date().toISOString() });
    saveState();
    showToast('✅ Поиск завершён', 'success');
  } catch (e) {
    showToast('Ошибка поиска: ' + e.message, 'error', 5000);
  }
  state.chatRunning = false;
  render();
}

// ── CHECKLIST ──

function autoExtractChecklist(project) {
  if (!project.checklist) project.checklist = [];
  AGENTS.forEach(agent => {
    const text = project.conclusions?.[agent.id]?.text;
    if (!text) return;
    const lines = text.split('\n');
    let inSection = false;
    lines.forEach(line => {
      if (line.match(/ОТКРЫТЫЕ ВОПРОСЫ/i)) { inSection = true; return; }
      if (line.match(/^## /) && !line.match(/ОТКРЫТЫЕ ВОПРОСЫ/i)) { inSection = false; }
      if (inSection) {
        const m = line.match(/^[•\-\*]\s+(.+)/);
        if (m) {
          const txt = m[1].trim();
          if (txt && !project.checklist.some(i => i.text === txt)) {
            project.checklist.push({ id: generateId(), text: txt, done: false, agentId: agent.id, createdAt: new Date().toISOString(), deadline: '' });
          }
        }
      }
    });
  });
  saveState();
  render();
  showToast(`✅ Задачи извлечены из заключений`, 'success');
}

  project.checklist.push({ id: generateId(), text: text.trim(), done: false, agentId: null, createdAt: new Date().toISOString(), deadline: '' });
  saveState(); render();
}

}

  if (project) { project.checklist = (project.checklist||[]).filter(i => i.id !== itemId); saveState(); render(); }
}

function setChecklistDeadline(projectId, itemId, date) {
  const project = state.projects.find(p => p.id === projectId);
  const item = project?.checklist?.find(i => i.id === itemId);
  if (item) { item.deadline = date; saveState(); }
}

// ── DEADLINE ──

function setProjectDeadline(projectId, date) {
  const project = state.projects.find(p => p.id === projectId);
  if (project) { project.deadline = date; saveState(); render(); }
}

function startEditTask() { state.editingTask = true; render(); }
function cancelTaskEdit() { state.editingTask = false; render(); }
function saveTaskEdit() {
  const project = getProject();
  if (!project) return;
  const newTask = document.getElementById('edit-task-input')?.value?.trim();
  if (!newTask) { showToast('Задача не может быть пустой', 'error'); return; }
  project.task = newTask;
  saveState();
  state.editingTask = false;
  showToast('✅ Задача обновлена', 'success');
  render();
}

async function addProjectFiles(projectId, fileList) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!project.files) project.files = [];
  for (const file of Array.from(fileList)) {
    showToast(`⏳ Читаю ${file.name}...`, 'info', 3000);
    try {
      const text = await extractText(file);
      project.files.push({ name: file.name, text });
      saveState();
      showToast(`✅ ${file.name} добавлен`, 'success', 2000);
      render();
    } catch (e) {
      showToast(`❌ ${file.name}: ${e.message}`, 'error', 5000);
    }
  }
}

function removeProjectFile(projectId, index) {
  const project = state.projects.find(p => p.id === projectId);
  if (!project) return;
  const name = project.files[index]?.name || 'файл';
  if (confirm(`Удалить "${name}" из проекта?`)) {
    project.files.splice(index, 1);
    saveState();
    render();
  }
}

function nextStep1() {
  syncStep1Data();
  if (!state.newProject.data.name) { showToast('Введите название проекта', 'error'); return; }
  state.newProject.step = 2;
  render();
}

function nextStep2() {
  const loading = state.newProject.files.some(f => f.status === 'loading');
  if (loading) { showToast('Дождитесь загрузки файлов', 'error'); return; }
  state.newProject.step = 3;
  render();
}

function prevStep() {
  state.newProject.step = Math.max(1, state.newProject.step - 1);
  render();
}

async function handleFiles(fileList) {
  for (const file of Array.from(fileList)) {
    const entry = { name: file.name, status: 'loading', text: '', error: '' };
    state.newProject.files.push(entry);
    render();
    try {
      entry.text = await extractText(file);
      entry.status = 'done';
    } catch (e) {
      entry.status = 'error';
      entry.error = e.message;
    }
    render();
  }
}

function removeFile(index) {
  state.newProject.files.splice(index, 1);
  render();
}

function createProject() {
  const task = document.getElementById('np-task')?.value?.trim();
  if (!task) { showToast('Опишите задачу проекта', 'error'); return; }
  const project = {
    id: generateId(),
    ...state.newProject.data,
    task,
    files: state.newProject.files.filter(f => f.status === 'done').map(f => ({ name: f.name, text: f.text })),
    status: 'Активный',
    conclusions: {},
    createdAt: new Date().toISOString()
  };
  state.projects.unshift(project);
  saveState();
  showToast('✅ Проект создан!', 'success');
  state.currentProjectId = project.id;
  state.currentTab = 'agents';
  state.page = 'project';
  render();
  if (state.settings.claudeKey) {
    setTimeout(() => runAllAgents(project.id), 300);
  } else {
    showToast('⚠️ Добавьте Claude API ключ в Настройках для запуска анализа', 'error', 6000);
  }
}

function switchTab(tab) {
  state.currentTab = tab;
  if (tab !== 'report') state.reportAgentFilter = null;
  render();
}

function setReportAgent(agentId) {
  state.reportAgentFilter = agentId;
  render();
}

function changeProjectStatus(e) {
  const project = getProject();
  if (project) { project.status = e.target.value; saveState(); render(); }
}

function deleteProject(id) {
  if (!confirm('Удалить проект? Все заключения будут потеряны.')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  saveState();
  navigate('dashboard');
}

async function handleSaveToNotion() {
  const project = getProject();
  if (!project) return;
  const btn = document.getElementById('notion-save-btn');
  if (btn) { btn.textContent = '⏳ Сохраняю...'; btn.disabled = true; }
  try {
    const id = await saveToNotion(project);
    showToast('✅ Сохранено в Notion!', 'success');
    if (btn) { btn.textContent = '✅ Сохранено'; }
  } catch (e) {
    showToast('❌ Ошибка Notion: ' + e.message, 'error', 6000);
    if (btn) { btn.textContent = '💾 Сохранить в Notion'; btn.disabled = false; }
  }
}

// ══════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ══════════════════════════════════════════════════════════════

function attachListeners() {
  const dz = document.getElementById('drop-zone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });
  }
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════

loadState();
render();
</script>
</body>
</html>
